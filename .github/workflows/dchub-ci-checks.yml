# dchub-ci-checks — partner-authored env-key CI harness.
# Four checks against the LIVE surface (tools/ci_dchub_checks_envkey.py):
#   1. manifest tools_count >= 74 at /.well-known/mcp.json
#   2. API key present in env (X_API_KEY <- secrets.DC_HUB_API_KEY; CI never mints)
#   3. analyze_site over the real MCP handshake — paid_only preview (with
#      human_message) OR full data both pass; anything else is PAID_PREVIEW_FAIL.
#   4. gas tools return prices for the Pro key (GAS_PRO_FAIL).
# Exit codes: 0 pass / 2 manifest / 3 missing key / 4 paid-preview / 5 gas Pro.
name: DC Hub CI checks (env-key)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * *" # nightly — catch live manifest / paywall drift
  workflow_dispatch:

jobs:
  dchub-checks:
    # Probes the LIVE dchub.cloud surface with secrets.DC_HUB_API_KEY, so it
    # says nothing about a PR's code. Dependabot PRs get no repo secrets and
    # always failed MISSING_KEY_FAIL (#988-#992, 2026-10-16); skip them.
    if: github.actor != 'dependabot[bot]'
    # ★ INFORMATIONAL ON PRs (2026-10-18). This job judges production, not the PR:
    #   a slow dchub.cloud endpoint failed it at 01:11Z and 04:38Z and blocked
    #   mcp#1024, whose files never touch the gas tools. On a pull_request a
    #   failure is reported (red steps and annotations in the run) but the job
    #   concludes success, so the required `dchub-checks` context cannot be held
    #   hostage by production. push-to-main and the nightly schedule stay STRICT:
    #   that is where live-surface drift is supposed to turn red.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Run DC Hub CI checks
        env:
          X_API_KEY: ${{ secrets.DC_HUB_API_KEY }}
          # Web Bot Auth: scripts/web_bot_auth.py signs this step's requests to
          # dchub.cloud (unsigned if the key or `cryptography` is missing).
          WEB_BOT_AUTH_PRIVATE_JWK: ${{ secrets.WEB_BOT_AUTH_PRIVATE_JWK }}
        run: python tools/ci_dchub_checks_envkey.py
