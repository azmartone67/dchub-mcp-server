name: manifest-consistency
# Fails if the MCP tool manifest surfaces drift from server.mjs (the single
# source of truth). Prevents the 42-vs-47 / 2.2.x-vs-2.3.x drift registries scrape.
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node scripts/sync-tools-manifest.mjs
