name: publish agent packages (manual)

# Manual only. Publishes the framework wrappers that agent builders install:
#   - langchain-dchub  (PyPI, trusted publishing / OIDC — no stored token)
#   - dchub-ai-sdk     (npm, trusted publishing / OIDC — no stored token)
# One-time owner setup (outside this repo):
#   PyPI: add a "pending trusted publisher" for project langchain-dchub ->
#         owner azmartone67, repo dchub-mcp-server, workflow publish-agent-packages.yml, environment pypi.
#   npm:  npm trusted publishing needs the package to exist; first publish dchub-ai-sdk once from an
#         owner login, then add this workflow as its trusted publisher (environment npm).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish"
        required: true
        type: choice
        options: [langchain-dchub, dchub-ai-sdk]

permissions:
  contents: read

jobs:
  langchain-dchub:
    if: inputs.package == 'langchain-dchub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: integrations/langchain-dchub
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (no network)
        run: |
          python -m pip install -U pip
          pip install -e . --group test
          pytest -q --disable-socket --allow-unix-socket tests/unit_tests
      - name: Copy guard (no plan/price/free/tool-count wording in the published README)
        run: |
          if grep -niE '\bfree\b|paid|\$[0-9]|credits?\b|trial|[0-9]+ tools|UTC day|signup' README.md; then
            echo "::error::README carries wording that agent-facing copy must not carry"; exit 1; fi
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: integrations/langchain-dchub/dist

  dchub-ai-sdk:
    if: inputs.package == 'dchub-ai-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdk/ai-sdk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g 'npm@^11.5.1'
      - name: Tests
        run: |
          npm install --no-save ai @ai-sdk/mcp
          npm test
      - name: Copy guard
        run: |
          if grep -niE '\bfree\b|paid|\$[0-9]|credits?\b|trial|[0-9]+ tools|UTC day|signup' README.md index.mjs index.d.ts; then
            echo "::error::package copy carries wording that agent-facing copy must not carry"; exit 1; fi
      - run: npm publish --provenance --access public
