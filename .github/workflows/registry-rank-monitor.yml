name: registry rank + drift monitor

# Automates the manual registry audit: a PROACTIVE competitive radar that tracks
# Smithery SEARCH RANK for the key terms (naming the leader to beat on each),
# cross-registry version/tool-count parity, and README drift; OPENS/REFRESHES a
# GitHub issue when a CORE term falls out of #1, a rival contests 2+ CORE terms,
# or the registry/README drifts stale. Read-only (public APIs) — no secrets.
# 6h CLOUD BACKSTOP: the local Rank Defense Master Shell (cloud.dchub.rank-probe, ~90
# min) is the fast primary detector; this catches slips when the Mac is asleep. A slip
# is a RELEVANCE loss (recency ≈ 0 for Smithery rank) — the monitor emits `remediate`
# so this workflow can fire the automatable half (registry-pr-submit) when armed.

on:
  schedule:
    - cron: '17 */6 * * *'       # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-rank-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run rank + drift monitor
        id: mon
        run: python3 scripts/registry_monitor.py

      - name: Open / refresh alert issue on regression
        if: steps.mon.outputs.regression == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔻 Registry rank/drift alert"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            echo "Refreshing existing alert issue #$NUM"
            gh issue comment "$NUM" --body-file monitor_report.md
          else
            echo "Opening new alert issue"
            gh issue create --title "$TITLE" --body-file monitor_report.md \
              --label "registry,automated" 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file monitor_report.md
          fi

      # (Removed 2026-07-13: the earlier "fire registry-pr-submit on a CORE slip" step
      # was misguided — a Smithery relevance slip is NOT fixed by awesome-list PRs, and
      # the dispatch was a no-op anyway (workflow_dispatch dry_run defaults true). The
      # real remedy is the owner-UI description paste, which the local Rank Defense
      # master shell already stages + escalates. registry-pr-submit stays on its own
      # weekly cadence for genuine list ADDs.)

      - name: Auto-close alert issue when healthy again
        if: steps.mon.outputs.regression == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔻 Registry rank/drift alert"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ Recovered — CORE cluster back at #1 and registry record in sync. Auto-closing."
            gh issue close "$NUM"
          fi
