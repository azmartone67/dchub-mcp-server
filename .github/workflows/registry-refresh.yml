name: registry refresh + drift guard

# (a) 2026-06-04: the public registries (Glama, PulseMCP, the official MCP
# registry) pull from the SOURCE files in this repo, not the live mcp.json.
# Stale numbers ($324B, 20,000+ facilities, 140+ countries, "DC Hub Nexus")
# silently resurfaced on journalist-facing registry pages because nothing
# guarded these files. This workflow:
#   1. GUARD — fail if any forbidden/stale number reappears in the source.
#   2. PUBLISH (best-effort) — re-publish to the official MCP registry on a
#      weekly cadence IF mcp-publisher auth is available; otherwise it logs a
#      clear skip so the source stays guarded even before publish is wired.

on:
  schedule:
    - cron: '30 6 * * 1'      # weekly, Monday 06:30 UTC
  push:
    # ★2026-08-31: `branches` was absent, so a push to ANY feature branch that
    # touched server.json ran the publish job with the DNS key and pushed that
    # branch's manifest to registry.modelcontextprotocol.io — the cascade source
    # for PulseMCP / mcp.so / Glama / ToolPlex. An unreviewed branch could
    # therefore change what every aggregator serves, and the version-bump guard
    # made it worse: bumping (which it requires) is exactly what makes the early
    # publish succeed instead of no-op. Publish only from main.
    branches:
      - main
    paths:
      - 'mcp-server.json'
      - 'integrations/**'
      - 'server.json'
      - 'README.md'
      # The guard reads canon from the snapshot, so a canon move must re-run it —
      # otherwise a figure that just became canonical stays judged by the old one.
      - 'canonical/canon_phrases.json'
      - 'scripts/registry_stale_guard.py'
      - 'scripts/registry_version_bump_guard.py'
      # ★2026-08-31: THE WORKFLOW ITSELF. It was absent from its own paths, so
      # editing this file — including the publish job's trigger condition, the
      # thing that decides whether anything is published at all — did not re-run
      # it, and the change shipped unexercised. Found while adding the ref gate
      # below: the PR that introduced it produced no run of this workflow.
      # Fenced but not triggered is the same trap the guard-script entries above
      # exist to avoid; the file that steers the fence belongs in the fence.
      - '.github/workflows/registry-refresh.yml'
  # 2026-08-13: external refresh hook. Every listing target that is not a
  # PR-submit has to be poked from OUTSIDE the repo — a registry UI, a cron
  # elsewhere, or a human with a curl. There was no such entry point: both sync
  # workflows were schedule + manual-only, so an external service asking to
  # trigger a refresh had nothing to call. Payload is ignored; the job always
  # does the same full heal.
  #   curl -X POST -H "Authorization: Bearer $GH_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/azmartone67/dchub-mcp-server/dispatches \
  #     -d '{"event_type":"refresh-listings"}'
  repository_dispatch:
    types: [refresh-listings]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # for the official registry's GitHub-OIDC auth

jobs:
  guard:
    name: honest-numbers drift guard
    runs-on: ubuntu-latest
    steps:
      # ★ fetch-depth: 0 is load-bearing for the version-bump guard below — it
      # walks server.json's history back to the commit that set the current
      # version. On the default depth-1 checkout it can see no history, fails
      # open by design, and reports "did not run". A guard that silently does
      # not run is the exact failure mode this whole job exists to end, so pay
      # the full clone here rather than let it go quiet.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # ★2026-08-05: the guard body moved to scripts/registry_stale_guard.py and
      # now READS canon from canonical/canon_phrases.json. It used to carry the
      # canonical figures twice inline — in a comment and in its own ::error::
      # message — both frozen at 2026-07-30 ("81 tools · 15,300+ facilities")
      # while live canon had moved to 82 / 16,500+. A guard written to stop
      # stale numbers was publishing two of them, in the exact message a human
      # reads to learn the right number. It also forbade "17,000+ facilit"
      # outright, so the day the fleet crosses 17,000 it would have rejected the
      # TRUE count. See the script's docstring for the full rationale.
      - name: Guard registry sources against retired/stale numbers
        run: python3 scripts/registry_stale_guard.py

      # ★2026-08-31: the publish step treats the registry's duplicate-version
      # rejection as a graceful no-op — correct when nothing changed, a silent
      # staleness bug when server.json's CONTENT moved and the version did not.
      # Measured that day: version 2.12.1 was set in 941b8d5, then two commits
      # changed the manifest without bumping (toolCount 82 -> 83, plus the new
      # deploymentType / canonicalRemote / gatewayNote fields). Every push since
      # re-attempted the publish, took the 400, and reported success, while the
      # official registry — the cascade source for PulseMCP / mcp.so / Glama /
      # ToolPlex — kept serving the old manifest. The workflow already stated
      # the rule ("bump server.json's version when you modify things"); nothing
      # enforced it. This does. It fails OPEN on insufficient history, so it can
      # never red the repo on a verdict it could not actually reach.
      - name: Guard against an unbumped server.json (silent publish no-op)
        run: python3 scripts/registry_version_bump_guard.py

      - name: 'Guard — version-bump fence self-test (must-fail controls)'
        run: python3 scripts/registry_version_bump_guard.py --self-test
      - name: Validate JSON well-formedness
        run: |
          python3 -c "import json,glob,sys
          bad=0
          for f in ['mcp-server.json','integrations/chatgpt/openapi.json','server.json']:
              try:
                  import os
                  if os.path.exists(f): json.load(open(f)); print('valid:',f)
              except Exception as e:
                  print('INVALID',f,e); bad=1
          sys.exit(bad)"

  publish:
    name: auto-refresh official MCP registry (cascades to aggregators)
    needs: guard
    runs-on: ubuntu-latest
    # AUTO-REFRESH (2026-06-14): runs on every manifest change (push to server.json),
    # the weekly cron, and manual dispatch. The official registry is the CASCADE SOURCE —
    # publishing a NEW server.json version re-syncs PulseMCP / mcp.so / Glama / ToolPlex
    # and the GitHub MCP Registry on their own cadence, so a single bump refreshes them
    # all. An UNCHANGED version is a graceful no-op (the registry rejects duplicate
    # versions). So: bump server.json's version when you modify things → everything refreshes.
    # ★2026-08-31 — REF-GATED. This condition accepted a push to ANY ref, so a
    # feature branch could publish to the PRODUCTION registry before review.
    # It did: 2.12.2 went out from the draft branch of #282, minutes after that
    # branch was pushed and well before it merged. That one landed well — it was
    # the fix for a real staleness — but the mechanism is wrong in a way that
    # does not undo. A published version CANNOT be withdrawn, so an abandoned or
    # rejected PR burns a version number the default branch never carries, and
    # the registry ends up advertising a release that exists on no branch.
    # `schedule` always runs on the default branch, so this only narrows `push`
    # and `workflow_dispatch` — both of which should be main for a publish.
    # Pinned by test/registry-publish-ref-gated.test.mjs.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Publish server.json to the official MCP registry (DNS-auth)
        run: |
          if [ ! -f server.json ]; then
            echo "::notice::No server.json present — skipping publish."; exit 0
          fi
          VER=$(python3 -c "import json;print(json.load(open('server.json')).get('version','?'))")
          echo "server.json version: $VER"
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher 2>/dev/null || { echo "::notice::mcp-publisher download failed — skipping."; exit 0; }
          # cloud.dchub is a DNS namespace — OIDC (io.github.* only) does NOT cover it, which
          # is why this used to silently skip. Authenticate with the operator's Ed25519 key:
          # secret MCP_REGISTRY_DNS_KEY = the hex private key whose public key is published in
          # the dchub.cloud APEX TXT record (v=MCPv1; k=ed25519; p=...). One-time setup.
          if [ -n "$MCP_REGISTRY_DNS_KEY" ]; then
            ./mcp-publisher login dns --domain dchub.cloud --private-key "$MCP_REGISTRY_DNS_KEY" 2>&1 \
              || { echo "::error::DNS login failed — the MCP_REGISTRY_DNS_KEY secret must match the dchub.cloud apex TXT record."; exit 1; }
          else
            echo "::warning::MCP_REGISTRY_DNS_KEY secret not set — auto-publish disabled. Add it (hex key from ~/.mcp-publisher/dchub-registry-key.hex) to enable the cascade refresh. Trying OIDC as a fallback…"
            ./mcp-publisher login github-oidc 2>&1 || { echo "::notice::No usable auth — skipping. Source stays guarded."; exit 0; }
          fi
          OUT=$(./mcp-publisher publish 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qi "Successfully published"; then
            echo "::notice::✅ published $VER — PulseMCP / mcp.so / Glama / ToolPlex will re-sync from the official registry on their own cadence."
          elif echo "$OUT" | grep -qiE "already exists|version.*exists|invalid.*version|duplicate"; then
            echo "::notice::version $VER is already on the registry (no change). Bump server.json's version to publish a refresh — it cascades to every aggregator."
          else
            echo "::warning::publish did not confirm success — review the log above."
          fi
