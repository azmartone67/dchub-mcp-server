name: smithery freshness heartbeat

# INSURANCE republish (durable / cloud). CORRECTION 2026-07-12: a 27-agent teardown
# (Spearman over registry.smithery.ai ordering) proved Smithery rank is RELEVANCE-
# driven, NOT recency — score[query-vs-displayName+description] 0.61-0.88 and verified
# 0.80-0.88 drive order; createdAt[recency] ≈ 0.00 AND is frozen at first-publish, so
# NO republish cadence moves rank. byteaskai beats us on "interconnection" by out-
# SCORING + out-USING us, not by being fresher. This job is therefore INSURANCE only:
# `smithery mcp publish` re-scans the live server so verified/deployment/tool-catalog
# stay healthy — it is NOT a rank lever. The real fix for a slip is relevance (owner-UI
# description; keywords) — see the Rank Defense Master Shell. Pairs with the local
# daily LaunchAgent (scripts/cloud.dchub.smithery-freshness.plist).
#
# Auth: repo secret SMITHERY_API_KEY, falling back to SMITHERY_TOKEN (the smithery
# CLI reads $SMITHERY_API_KEY, so the env name stays fixed either way).
#
# ★ 2026-09-02 — TWO CREDENTIALS EXIST AND ONLY ONE OF THEM WORKS.
#   dchub-mcp-server  SMITHERY_API_KEY  (created 06-21) -> 403 servers:write
#   dchub-backend     SMITHERY_TOKEN    (created 06-02) -> publishes fine
# The working credential was in the OTHER REPO under a DIFFERENT NAME, so this
# lane read as 'the key must be reissued' for days when the likelier fix was
# 'point at the one that already works'. Accepting either name here means the
# owner has two ways to fix it and neither repo silently owns the only copy.
#
# ★ NOT PROVEN EQUIVALENT: SMITHERY_TOKEN is only known to satisfy
# `PUT /servers/{ns}/{srv}/releases` (what `smithery mcp publish` calls). The
# write below is a DIFFERENT endpoint, `PATCH api.smithery.ai/servers/{ns}/{srv}`,
# and Smithery does not document its scope. If SMITHERY_TOKEN also lacks
# servers:write this lane will say so on the next run, naming the scope — which
# is the point: the fallback is a hypothesis this workflow TESTS, not a claim.
# `smithery mcp publish` re-scans the live server + refreshes freshness — no
# version bump or code change required. Rotate: re-set the secret from
# ~/Library/Application Support/smithery/settings.json .apiKey.

on:
  schedule:
    # ── r-stop-the-rank-chase (2026-09-07): DAILY -> WEEKLY.
    # KEPT, unlike the four rank-chasing schedules disabled in this PR, because
    # this one is not a rank lever and never claimed to be — its own header says
    # recency is ~0 for Smithery rank. What it buys is INSURANCE: the publish
    # re-scans the live server so verified / deployment / tool-catalog stay
    # healthy, and losing `verified` on a live listing is a real regression.
    # Insurance does not need 7 runs a week to do that, so this drops 6 of 7.
    - cron: '23 14 * * 1'   # WEEKLY Monday 14:23 UTC (was DAILY). INSURANCE re-publish (keeps verified/deploy/tool-catalog fresh); recency ≈ 0 for rank, so this does NOT hold #1 — relevance does. Local daily LaunchAgent is the redundant backup.
  workflow_dispatch:
    inputs:
      force_overwrite:
        # ★ 2026-09-24: the ONLY way past the drift guard below. Use it to REVERT a
        # live edit on purpose; to KEEP the live edit, mirror it into
        # scripts/smithery_description.txt by PR instead.
        description: 'Overwrite the live Smithery description even if it was edited outside the repo'
        type: boolean
        default: false

permissions:
  contents: read
  # ★ 2026-09-24 drift guard: `actions: read` lists/downloads the previous run's
  # last-written record (a workflow artifact); `issues: write` opens/updates the
  # "Smithery listing edited outside the repo" issue. Nothing here pushes.
  actions: read
  issues: write

concurrency:
  group: smithery-freshness
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      # ★ 2026-08-22: this job never checked the repo out — the publish and
      # convergence steps only ever needed the CLI and the live server. The
      # listing-copy step below reads scripts/smithery_description.txt, and its
      # first run died on FileNotFoundError *before* it could print the owner
      # action it exists to print. A red step that names no remedy is the
      # failure mode this lane was built to end. Shallow checkout, read-only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Re-publish to Smithery (freshness heartbeat)
        id: publish
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY || secrets.SMITHERY_TOKEN }}
        run: |
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "::warning::SMITHERY_API_KEY secret not set — skipping freshness heartbeat (add it to re-enable)."
            exit 0
          fi
          # NO --config-schema: keyless-first, zero-config connect (see heartbeat.sh note).
          npx -y @smithery/cli@latest mcp publish https://dchub.cloud/mcp -n azmartone67/dchub

      # ★2026-07-28: this job used to END at the publish above, which exits 0 on
      # {"status":"PENDING"} — the release being ACCEPTED, not the listing being
      # UPDATED. So it reported success 100% of the time while the public listing
      # sat two revisions stale (80 tools, plan_query still "START HERE" after the
      # live catalogue had moved to 81 / "INSPECT-ONLY"). A heartbeat that cannot
      # fail is not a heartbeat. This step verifies the OUTCOME from the caller's
      # seat: what the registry actually serves to an agent, compared against what
      # our live server serves. Convergence was ~60s when measured; the budget is
      # 10 minutes.
      # ★2026-09-05: the check itself moved to scripts/verify_smithery_converged.py
      # so the LOCAL LaunchAgent lane runs the SAME one. It had no convergence
      # check at all and beat the dead-man ledger `success` off the publish CLI's
      # exit code — 637 of 637 releases reported PENDING and every beat was green.
      # A check that exists in two places drifts; this one now exists once.
      - name: Verify the listing actually converged
        id: converge
        run: |
          set +e
          python3 scripts/verify_smithery_converged.py --checks 20 --interval 30
          rc=$?
          set -e
          # 0 converged · 1 diverged (real failure) · 2 inconclusive (we could not
          # read our OWN tools/list, so there was nothing to compare — that must
          # not turn the publish lane red, and it must not read green either).
          if [ "$rc" -eq 2 ]; then
            echo "::warning::convergence UNVERIFIED — see the reason above. Not failing the heartbeat."
            exit 0
          fi
          exit "$rc"

      # ★ 2026-09-24 — DRIFT GUARD: the writer only overwrites text it wrote.
      # On 2026-09-24 a new description was pasted live on Smithery by hand, with
      # no repo change. The white-glove step below would have overwritten it with
      # the stale repo file on its next run, and nothing would have said so (PR
      # #537 mirrored it by hand). So before any PATCH, scripts/smithery_drift_guard.py
      # reads the LIVE text on api.smithery.ai and compares it with the repo file
      # AND with the sha256 of what this writer last wrote:
      #   live == repo              -> in_sync       (no write; closes the issue)
      #   live == last written      -> write         (only the repo changed)
      #   neither / no record yet   -> foreign_edit  (NO write, ::warning::, issue)
      #   unreadable                -> unreadable    (NO write, warning)
      # A foreign edit is a HUMAN DECISION, not a broken lane: nothing here goes
      # red for it. `force_overwrite` (dispatch input) is the only bypass.
      #
      # WHERE THE RECORD LIVES: a workflow artifact, carried run to run. Not a
      # committed file: main requires status checks (check/dchub-checks/smoke)
      # with enforce_admins, so a GITHUB_TOKEN push to main is refused, and a
      # PR-per-write would leave the record unmerged exactly when the next run
      # needs it. Not a repo variable: GITHUB_TOKEN cannot write Actions
      # variables (that needs a PAT). Not actions/cache: entries unread for 7
      # days are evicted, and this cron is exactly weekly. An artifact keeps 90
      # days and is re-uploaded on every run that knows the state (confirmed
      # write, in sync, or carried forward on a foreign edit), so it never ages
      # out while the lane runs. Only records from default-branch runs count.
      - name: Drift guard — never overwrite a live edit this writer did not make
        id: driftguard
        if: always()
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY || secrets.SMITHERY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite || 'false' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_TITLE: Smithery listing edited outside the repo
        run: |
          mkdir -p .smithery-state
          # 1. restore the last-written record from the newest default-branch run
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=smithery-description-last-written&per_page=50" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"${DEFAULT_BRANCH:-main}\")] | sort_by(.created_at) | last | .id // empty" 2>/dev/null) || ART_ID=""
          if [ -n "$ART_ID" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > .smithery-state/prev.zip \
             && unzip -o -q .smithery-state/prev.zip -d .smithery-state; then
            echo "restored last-written record from artifact $ART_ID: $(cat .smithery-state/last_written.sha256 2>/dev/null)"
          else
            echo "::notice::no last-written record found — the guard fails safe (no write unless live == repo)"
          fi
          # 2. decide. Exit 0 for every verdict; non-zero only if the guard itself could not run.
          set +e
          python3 scripts/smithery_drift_guard.py \
            --record .smithery-state/last_written.sha256 \
            --issue-body-out .smithery-state/issue.md \
            --force "$FORCE_OVERWRITE" | tee .smithery-state/guard.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] || { echo "::error::drift guard could not run (exit $rc) — the white-glove step will not write"; exit "$rc"; }
          VERDICT=$(sed -n 's/^verdict=//p' .smithery-state/guard.log | tail -1)
          # 3. the human-decision issue, deduped by its fixed title. A GitHub API
          # hiccup here warns; it never turns the lane red.
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
                   --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty" 2>/dev/null) || OPEN=""
          if [ "$VERDICT" = "foreign_edit" ]; then
            if [ -n "$OPEN" ]; then
              gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file .smithery-state/issue.md \
                && echo "updated issue #$OPEN" || echo "::warning::could not update issue #$OPEN"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file .smithery-state/issue.md \
                || echo "::warning::could not open the '$ISSUE_TITLE' issue — the warning above stands"
            fi
          elif [ "$VERDICT" = "in_sync" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Live Smithery description now matches scripts/smithery_description.txt (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Closing." \
              || echo "::warning::could not close issue #$OPEN"
          fi

      # ★ 2026-08-22 — the listing COPY is owner-pasted and nothing compared it.
      # `smithery mcp publish` refreshes tools/verification; the `description`
      # Smithery serves is whatever was last pasted into the owner UI. On
      # 2026-08-21 the live text still advertised the DCGI (withdrawn 08-08),
      # "2,000+ tracked M&A deals" against a canon of 1,900+, "17,700+" data
      # centers against 18,500+, and "65 tracked feeds" against a live 70 — on
      # the ONE channel with measured volume (72.7% of external calls) — and
      # every monitor read green because none of them read that field.
      # This step reads it. scripts/smithery_description.txt is the single
      # origin (the quantity healer keeps its canon numbers current); a
      # mismatch is RED and names the owner action. UNREADABLE is not DRIFT:
      # an API failure warns and exits 0. Runs after the beat on purpose —
      # a copy mismatch must not make the publish lane read dead.
      # ★ 2026-08-22 — WHITE-GLOVE WRITES the Smithery description itself.
      # Smithery exposes a real authenticated write the publish CLI never surfaced:
      #   PATCH https://api.smithery.ai/servers/<ns>/<server>  {"description": ...}
      #   Authorization: Bearer $SMITHERY_API_KEY   -> {"success": true}
      # (the same token this workflow already uses to publish). The blurb was
      # owner-pasted and drifted for weeks on the #1 channel (72.7% of external
      # calls) — DCGI-as-live, "2,000+ deals", "17,700+", "65 tracked feeds".
      # This pushes scripts/smithery_description.txt (the single origin the
      # healer keeps current) and CONFIRMS the write on api.smithery.ai, the
      # authoritative store — NOT registry.smithery.ai, which is an
      # eventually-consistent read projection that flaps across edges (a single
      # read there was measured stale seconds after a confirmed write). success:true
      # is never trusted alone (the fake-push landmine). Idempotent. No key ⇒
      # warn+skip. Kill: repo/org var WHITE_GLOVE_SMITHERY_AUTOWRITE=0.
      - name: White-glove — auto-write the Smithery description (api.smithery.ai PATCH)
        id: whiteglove
        if: always()
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY || secrets.SMITHERY_TOKEN }}
          WHITE_GLOVE_SMITHERY_AUTOWRITE: ${{ vars.WHITE_GLOVE_SMITHERY_AUTOWRITE }}
          DRIFT_VERDICT: ${{ steps.driftguard.outputs.verdict }}
        run: |
          if [ "${WHITE_GLOVE_SMITHERY_AUTOWRITE:-1}" = "0" ]; then
            echo "::notice::white-glove Smithery auto-write disabled by var"; exit 0
          fi
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "::warning::no SMITHERY_API_KEY — cannot auto-write; the copy-check below names the owner-paste fallback"; exit 0
          fi
          # ★ 2026-09-24: write ONLY on the drift guard's `write` verdict. Anything
          # else — including no verdict at all (the guard crashed) — is no write.
          case "$DRIFT_VERDICT" in
            write) ;;
            in_sync) echo "::notice::drift guard: live already matches the repo file — no write"; exit 0 ;;
            foreign_edit) echo "::warning::drift guard: the live description was edited outside the repo — NOT overwriting (see the issue; re-run with force_overwrite to revert)"; exit 0 ;;
            *) echo "::warning::drift guard gave no write verdict ('${DRIFT_VERDICT}') — not writing"; exit 0 ;;
          esac
          python3 - <<'PY_WG'
          import json, os, re, sys, time, urllib.request, urllib.error
          KEY = os.environ["SMITHERY_API_KEY"]
          WANT = open("scripts/smithery_description.txt", encoding="utf-8").read()
          NS, SRV = "azmartone67", "dchub"
          API = f"https://api.smithery.ai/servers/{NS}/{SRV}"
          REG = f"https://registry.smithery.ai/servers/{NS}/{SRV}"
          norm = lambda t: re.sub(r"\s+", " ", (t or "").replace("\\&", "&")).strip()
          STALE = [r"\bDCGI\b(?![^.]*withdrawn)", r"\b\d+ tracked feeds\b"]
          def get(url, auth):
              # ★2026-09-13: a unique query string on EVERY read. registry.smithery.ai
              # served our plain URL as a CDN HIT 3.5h old, and api.smithery.ai sends
              # the same s-maxage=14400. Run 34736406217 pre-read a stale 2,588-char
              # description while the store held the 2,243 chars this file wants,
              # PATCHed text that already matched, then "confirmed" against the same
              # stale copy and went red.
              h = {"User-Agent": "dchub-white-glove/1.0"}
              if auth: h["Authorization"] = f"Bearer {KEY}"
              fresh = f"{url}{'&' if '?' in url else '?'}_={int(time.time() * 1000)}"
              return json.load(urllib.request.urlopen(urllib.request.Request(fresh, headers=h), timeout=30))
          def clean(desc): return norm(desc) == norm(WANT) and not any(re.search(p, desc, re.I) for p in STALE)
          # already in sync on the authoritative store?
          try:
              if clean(get(API, True).get("description") or ""):
                  print("::notice::Smithery description already matches scripts/smithery_description.txt (api.smithery.ai) — no write")
                  sys.exit(0)
          except Exception as e:
              print(f"::warning::could not pre-read api.smithery.ai ({e}) — proceeding to PATCH")
          # write
          req = urllib.request.Request(API, data=json.dumps({"description": WANT}).encode(), method="PATCH",
                headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/json", "User-Agent": "dchub-white-glove/1.0"})
          try:
              resp = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', 'replace')[:200]
              if e.code == 403:
                  # ★ 2026-09-02: measured on 08-29, 08-31 and 09-01 (run 33519871704):
                  #   HTTP 403: Missing required permission: servers:write
                  # The key has NEVER carried write scope — the 08-30 "pass" was the
                  # early-exit above (live copy already == txt). This is an OWNER
                  # action (regenerate the key with that scope; update the secret),
                  # so it gets its own titled annotation and is handed to the ledger
                  # beat below, which reports it on the dead-man board instead of
                  # letting the lane age out silently.
                  m = re.search(r"Missing required permission:\s*([\w:.-]+)", body)
                  scope = m.group(1) if m else "servers:write"
                  print(f"::error title=SMITHERY_KEY_SCOPE::Smithery PATCH 403 — SMITHERY_API_KEY lacks the `{scope}` permission. "
                        f"OWNER ACTION: check whether dchub-backend's SMITHERY_TOKEN (which publishes releases "
                        f"successfully) carries `{scope}` — if so, copy that value into this repo's "
                        f"SMITHERY_API_KEY secret and no new key is needed. Otherwise at smithery.ai -> "
                        f"Settings -> API keys, generate a key WITH `{scope}` and update the "
                        f"SMITHERY_API_KEY repo secret. Until then the listing copy only moves by owner-paste "
                        f"(https://smithery.ai/servers/azmartone67/dchub -> Edit). Response: {body}")
                  out = os.environ.get("GITHUB_OUTPUT")
                  if out:
                      with open(out, "a", encoding="utf-8") as fh:
                          fh.write(f"key_scope_missing={scope}\n")
                  sys.exit(1)
              print(f"::error::Smithery PATCH failed HTTP {e.code}: {body} — check SMITHERY_API_KEY write scope"); sys.exit(1)
          if not resp.get("success"):
              print(f"::error::Smithery PATCH did not report success: {resp}"); sys.exit(1)
          # AUTHORITATIVE verify on api.smithery.ai (consistent; never trust success:true)
          time.sleep(2)
          got = get(API, True).get("description") or ""
          if not clean(got):
              print(f"::error::Smithery PATCH returned success but api.smithery.ai did not reflect the new description ({len(got)} chars, stale markers may persist)"); sys.exit(1)
          print(f"::notice::white-glove wrote the Smithery description and confirmed it on api.smithery.ai ({len(got)} chars)")
          # best-effort: nudge the public registry projection (it lags & flaps — a warning, never a failure)
          for _ in range(6):
              time.sleep(5)
              try:
                  if clean(get(REG, False).get("description") or ""): print("::notice::public registry projection converged"); break
              except Exception: pass
          else:
              print("::warning::public registry.smithery.ai projection has not yet reflected the write (it lags api.smithery.ai) — the authoritative store is correct; the listing page will catch up")
          PY_WG
          # Reached only on exit 0: a CONFIRMED write, or the store already matched.
          # Either way api.smithery.ai holds the repo text — record it as ours.
          python3 scripts/smithery_drift_guard.py --record .smithery-state/last_written.sha256 --mark-written

      - name: Listing copy equals scripts/smithery_description.txt (owner-pasted)
        id: copycheck
        if: always()
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY || secrets.SMITHERY_TOKEN }}
          DRIFT_VERDICT: ${{ steps.driftguard.outputs.verdict }}
        run: |
          # ★ 2026-09-24: a foreign edit is held for a human by the drift guard; the
          # copy differing from the repo file is then EXPECTED, and must not paint
          # the lane red while the issue waits for a decision.
          if [ "${DRIFT_VERDICT:-}" = "foreign_edit" ]; then
            echo "::warning::listing copy differs from scripts/smithery_description.txt because it was edited outside the repo — held for a human (issue: 'Smithery listing edited outside the repo'), not drift"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          # ★2026-08-22: read api.smithery.ai (authed) — the AUTHORITATIVE store the
          # auto-write step targets. registry.smithery.ai is an eventually-consistent
          # projection that flaps across edges and false-failed this check. Fall back
          # to the public registry only when no key is present.
          #
          # ★★2026-09-05: THAT WAS NOT ENOUGH — api.smithery.ai flaps too, and this
          # step false-RED with the receipts one line apart in the same log:
          #
          #   00:47:18.078  ::notice:: white-glove wrote ... and CONFIRMED it on
          #                            api.smithery.ai (2243 chars)
          #   00:47:18.346  ::error::  Smithery listing DESCRIPTION drifted
          #
          # 268 ms, same authoritative store, opposite answers — the confirming read
          # and this one landed on different edges. The listing was correct the whole
          # time (verified 2,243 chars, byte-identical, from outside). It beat the
          # dead-man ledger RED, which is worse than not checking: a lane that cries
          # wolf on its own successful write teaches you to ignore it.
          #
          # A SINGLE READ OF AN EVENTUALLY-CONSISTENT STORE IS A COIN FLIP. The
          # `converge` step above already learned this for the tool catalogue and
          # polls with a budget; this step never got the lesson. It does now. A real
          # drift still fails — it simply has to still be there after the budget.
          KEY = os.environ.get("SMITHERY_API_KEY", "")
          ATTEMPTS, INTERVAL = 8, 15   # 7 sleeps = 1m45s, well past the observed flap
          REG = ("https://api.smithery.ai/servers/azmartone67/dchub" if KEY
                 else "https://registry.smithery.ai/servers/azmartone67/dchub")
          want = open("scripts/smithery_description.txt", encoding="utf-8").read()
          norm = lambda t: re.sub(r"\s+", " ", t.replace("\\&", "&")).strip()
          def read_live():
              # ★2026-09-13: a unique query string on every read. A retry budget absorbs
              # an edge FLAP; it cannot outlast a CDN copy of the plain URL that is kept
              # for hours (s-maxage=14400). Run 34736406217 read that cached copy for its
              # whole budget and failed a listing whose store already matched.
              _h = {"User-Agent": "dchub-smithery-freshness-verify/1.0"}
              if KEY: _h["Authorization"] = f"Bearer {KEY}"
              req = urllib.request.Request(f"{REG}?_={int(time.time() * 1000)}", headers=_h)
              return (json.load(urllib.request.urlopen(req, timeout=30)).get("description") or "")

          last, unread, empty = None, None, False
          for attempt in range(1, ATTEMPTS + 1):
              try:
                  live = read_live()
              except Exception as e:
                  unread = e; live = ""
              else:
                  unread = None
              empty = not live.strip()
              if live.strip():
                  stale = [m for m in (r"\bDCGI\b(?![^.]*withdrawn)", r"\b\d+ tracked feeds\b")
                           if re.search(m, live, re.I)]
                  if norm(live) == norm(want) and not stale:
                      print(f"::notice::Smithery listing copy matches scripts/smithery_description.txt "
                            f"({len(live)} chars, after {attempt} read(s))")
                      sys.exit(0)
                  # A STALE MARKER IS NOT A LAG. Retrying cannot turn withdrawn-DCGI
                  # copy into current copy, so fail it immediately and say why.
                  if stale:
                      print(f"::error::Smithery listing copy carries STALE MARKERS {stale} — that is "
                            f"published-copy drift, not replication lag. Fix "
                            f"scripts/smithery_description.txt and re-run.")
                      sys.exit(1)
                  last = f"{len(live)} live chars vs {len(want)} wanted"
              else:
                  # An empty description is UNMEASURED, not drift — preserved from the
                  # pre-retry version on purpose. Nothing about an empty read says our
                  # copy is wrong, and calling it drift would page for their outage.
                  empty = True
                  last = f"empty description (read error: {unread})" if unread else "empty description"
              if attempt < ATTEMPTS:
                  time.sleep(INTERVAL)

          if unread is not None or empty:
              print(f"::warning::listing copy UNMEASURED after {ATTEMPTS} attempts "
                    f"({last}) — not drift")
              sys.exit(0)
          print(f"::error::Smithery listing DESCRIPTION still differs from "
                f"scripts/smithery_description.txt after {ATTEMPTS} reads over "
                f"{(ATTEMPTS - 1) * INTERVAL}s ({last}). This is NOT the sub-second edge flap "
                f"the retry loop exists to absorb. If the white-glove step above reported a "
                f"confirmed write, the store has genuinely diverged; if it reported no key or "
                f"was skipped, that is the cause. Owner fallback: paste at "
                f"https://smithery.ai/servers/azmartone67/dchub -> Edit.")
          sys.exit(1)
          PY

      # ★ 2026-09-24: carry the drift guard's record to the next run. The file
      # exists after a confirmed write, an in-sync read, or (restored, unchanged)
      # on a foreign edit — re-uploading it every run keeps it inside retention.
      - name: Carry the last-written record to the next run
        # no hashFiles() gate: if-no-files-found: ignore already handles a run with no record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smithery-description-last-written
          path: .smithery-state/last_written.sha256
          retention-days: 90
          if-no-files-found: ignore

      # ★ BEAT THE DEAD-MAN LEDGER — LAST, ALWAYS, WITH THE LANE'S REAL STATUS.
      #
      # This beat used to run `if: success()` and sit BEFORE the white-glove
      # write, so that a failed day left the feed to go OVERDUE on
      # /api/v1/ops/deadman — the intended signal. Two things broke that:
      #   · the white-glove PATCH ran AFTER the beat, so its failure was beaten
      #     over: on 2026-08-29, 08-31 and 09-01 (run 33519871704) the PATCH
      #     died with `HTTP 403: Missing required permission: servers:write`
      #     minutes after the ledger had recorded a clean success;
      #   · "overdue" only appears after cadence_hours and is indistinguishable
      #     from "the cron never fired". A lane that RAN and FAILED should say
      #     so the minute it fails, and name the remedy.
      # So: `if: always()`, last in the job, status derived from every step's
      # outcome. `status: error` is the non-OK path in dchub-backend
      # routes/ingest_runs.py (`_OK_STATUS`) — it renders as a failed beat on
      # the board rather than a stale success — and the note names the failed
      # step and, for the key-scope case, the exact permission the owner must
      # add. The ledger contract ("records its last SUCCESSFUL run") is kept:
      # only a real success carries the success status. Fail-soft on the beat
      # itself (`|| true` shape): a ledger outage must never redden a healthy
      # publish — the beat reports the work, it is not the work.
      - name: Beat the dead-man ledger (status reflects the whole lane)
        id: beat
        if: always()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
          OUTCOME_PUBLISH: ${{ steps.publish.outcome }}
          OUTCOME_CONVERGE: ${{ steps.converge.outcome }}
          OUTCOME_DRIFTGUARD: ${{ steps.driftguard.outcome }}
          DRIFT_VERDICT: ${{ steps.driftguard.outputs.verdict }}
          OUTCOME_WHITEGLOVE: ${{ steps.whiteglove.outcome }}
          OUTCOME_COPYCHECK: ${{ steps.copycheck.outcome }}
          KEY_SCOPE_MISSING: ${{ steps.whiteglove.outputs.key_scope_missing }}
        run: |
          if [ -z "$DCHUB_ADMIN_KEY" ]; then
            echo "::warning::no DCHUB_ADMIN_KEY — cannot beat; this lane stays invisible on the dead-man board"
            exit 0
          fi
          STATUS=success
          NOTE="daily Smithery re-publish + listing convergence verified + description in sync"
          FAILED=""
          for pair in "publish:$OUTCOME_PUBLISH" "converge:$OUTCOME_CONVERGE" "driftguard:$OUTCOME_DRIFTGUARD" "whiteglove:$OUTCOME_WHITEGLOVE" "copycheck:$OUTCOME_COPYCHECK"; do
            case "${pair#*:}" in
              failure|cancelled) FAILED="$FAILED ${pair%%:*}" ;;
            esac
          done
          if [ -z "$FAILED" ] && [ "$DRIFT_VERDICT" = "foreign_edit" ]; then
            # a human-decision state, not a fault: the beat stays OK, the issue is the alarm
            NOTE="Smithery re-publish verified; description edited OUTSIDE the repo — auto-write held for a human (issue: Smithery listing edited outside the repo)"
          fi
          if [ -n "$FAILED" ]; then
            STATUS=error
            NOTE="lane FAILED at:${FAILED}"
            if [ -n "$KEY_SCOPE_MISSING" ]; then
              NOTE="$NOTE — SMITHERY_KEY_SCOPE: SMITHERY_API_KEY lacks ${KEY_SCOPE_MISSING}; owner: regenerate the key with that permission at smithery.ai and update the repo secret"
            fi
          fi
          BODY=$(jq -cn --arg s "$STATUS" --arg n "$NOTE" '{feed:"smithery-freshness",status:$s,cadence_hours:24,note:$n}')
          echo "beat: $BODY"
          curl -fsS -X POST "https://dchub-backend-production.up.railway.app/api/v1/admin/ingest-runs/beat" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: $DCHUB_ADMIN_KEY" \
            -H "User-Agent: dchub-smithery-freshness/1.0" \
            -d "$BODY" \
            && echo "  ✓ beat recorded (status=$STATUS)" || echo "::warning::beat failed (the lane's own result above stands)"
