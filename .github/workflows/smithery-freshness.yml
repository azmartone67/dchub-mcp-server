name: smithery freshness heartbeat

# INSURANCE republish (durable / cloud). CORRECTION 2026-07-12: a 27-agent teardown
# (Spearman over registry.smithery.ai ordering) proved Smithery rank is RELEVANCE-
# driven, NOT recency — score[query-vs-displayName+description] 0.61-0.88 and verified
# 0.80-0.88 drive order; createdAt[recency] ≈ 0.00 AND is frozen at first-publish, so
# NO republish cadence moves rank. byteaskai beats us on "interconnection" by out-
# SCORING + out-USING us, not by being fresher. This job is therefore INSURANCE only:
# `smithery mcp publish` re-scans the live server so verified/deployment/tool-catalog
# stay healthy — it is NOT a rank lever. The real fix for a slip is relevance (owner-UI
# description; keywords) — see the Rank Defense Master Shell. Pairs with the local
# daily LaunchAgent (scripts/cloud.dchub.smithery-freshness.plist).
#
# Auth: repo secret SMITHERY_API_KEY (the smithery CLI reads $SMITHERY_API_KEY).
# `smithery mcp publish` re-scans the live server + refreshes freshness — no
# version bump or code change required. Rotate: re-set the secret from
# ~/Library/Application Support/smithery/settings.json .apiKey.

on:
  schedule:
    - cron: '23 14 * * *'   # DAILY 14:23 UTC. INSURANCE re-publish (keeps verified/deploy/tool-catalog fresh); recency ≈ 0 for rank, so this does NOT hold #1 — relevance does. Local daily LaunchAgent is the redundant backup.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smithery-freshness
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      # ★ 2026-08-22: this job never checked the repo out — the publish and
      # convergence steps only ever needed the CLI and the live server. The
      # listing-copy step below reads scripts/smithery_description.txt, and its
      # first run died on FileNotFoundError *before* it could print the owner
      # action it exists to print. A red step that names no remedy is the
      # failure mode this lane was built to end. Shallow checkout, read-only.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Re-publish to Smithery (freshness heartbeat)
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            echo "::warning::SMITHERY_API_KEY secret not set — skipping freshness heartbeat (add it to re-enable)."
            exit 0
          fi
          # NO --config-schema: keyless-first, zero-config connect (see heartbeat.sh note).
          npx -y @smithery/cli@latest mcp publish https://dchub.cloud/mcp -n azmartone67/dchub

      # ★2026-07-28: this job used to END at the publish above, which exits 0 on
      # {"status":"PENDING"} — the release being ACCEPTED, not the listing being
      # UPDATED. So it reported success 100% of the time while the public listing
      # sat two revisions stale (80 tools, plan_query still "START HERE" after the
      # live catalogue had moved to 81 / "INSPECT-ONLY"). A heartbeat that cannot
      # fail is not a heartbeat. This step verifies the OUTCOME from the caller's
      # seat: what the registry actually serves to an agent, compared against what
      # our live server serves. Convergence was ~60s when measured; the budget is
      # 10 minutes.
      - name: Verify the listing actually converged
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request

          REG = "https://registry.smithery.ai/servers/azmartone67/dchub"
          MCP = "https://dchub.cloud/mcp"
          UA  = {"User-Agent": "dchub-smithery-freshness-verify/1.0"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def rpc(body, sid=None):
              """Streamable-HTTP MCP call. Responses may arrive as SSE frames."""
              h = dict(UA, **{"Content-Type": "application/json",
                              "Accept": "application/json, text/event-stream"})
              if sid:
                  h["Mcp-Session-Id"] = sid
              req = urllib.request.Request(MCP, data=json.dumps(body).encode(), headers=h)
              with urllib.request.urlopen(req, timeout=45) as r:
                  raw, hdr = r.read().decode(), r.headers.get("Mcp-Session-Id")
              if "data:" in raw[:200]:
                  raw = next(l[5:].strip() for l in raw.splitlines() if l.startswith("data:"))
              return json.loads(raw), hdr

          # Compare against tools/list — the exact surface Smithery crawls.
          # NOT /api/v1/mcp/tools.json: its `summary` is a separately curated
          # field that legitimately differs from the MCP `description` on 46 of
          # 81 tools, so comparing the two would fail this job every single day
          # while telling us nothing about whether the listing is fresh.
          try:
              _, sid = rpc({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                            "params": {"protocolVersion": "2024-11-05", "capabilities": {},
                                       "clientInfo": {"name": "dchub-freshness-verify",
                                                      "version": "1.0"}}})
              tl, _ = rpc({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}, sid)
              live_tools = {t["name"]: (t.get("description") or "")[:80]
                            for t in tl["result"]["tools"]}
          except Exception as e:
              print(f"::warning::cannot read our own tools/list ({e}) — "
                    "nothing to compare against, not failing the heartbeat")
              sys.exit(0)

          if not live_tools:
              print("::warning::live tools/list parsed empty — not failing")
              sys.exit(0)
          print(f"live tools/list: {len(live_tools)} tools")

          last = ""
          for attempt in range(1, 21):          # 20 x 30s = 10 minutes
              try:
                  reg = get(REG)
                  reg_tools = {t["name"]: (t.get("description") or "")[:80]
                               for t in (reg.get("tools") or [])}
              except Exception as e:
                  last = f"registry unreadable: {e}"
                  reg_tools = {}

              if reg_tools:
                  missing = sorted(set(live_tools) - set(reg_tools))
                  extra   = sorted(set(reg_tools) - set(live_tools))
                  # Descriptions matter as much as membership: the stale listing
                  # had the right COUNT for days while plan_query still read
                  # "START HERE". Compare the text an agent actually reads.
                  changed = sorted(n for n in set(live_tools) & set(reg_tools)
                                   if live_tools[n] != reg_tools[n])
                  if not (missing or extra or changed):
                      print(f"::notice::listing converged after {attempt} check(s): "
                            f"{len(reg_tools)} tools, descriptions match live")
                      sys.exit(0)
                  last = (f"{len(reg_tools)} listed vs {len(live_tools)} live; "
                          f"missing={missing[:5]} extra={extra[:5]} stale_desc={changed[:5]}")

              print(f"  attempt {attempt}/20: {last}")
              time.sleep(30)

          print(f"::error::Smithery published but the listing did NOT converge "
                f"within 10 minutes. {last}. The publish was ACCEPTED and the "
                f"re-crawl did not land — this is exactly the failure that used "
                f"to report green. Check https://smithery.ai/servers/azmartone67/dchub/releases "
                f"for the release status, and correct the listing by hand if the "
                f"deployment is stuck.")
          sys.exit(1)
          PY

      # ★ BEAT THE DEAD-MAN LEDGER — but ONLY ON SUCCESS.
      #
      # This lane is the only DAILY-updating registry channel there is, and on
      # 2026-08-03 and 08-04 it failed on `stale_desc=['search_facilities']`
      # (Smithery's cached description for one tool would not refresh; retried
      # 20x, gave up). It failed correctly and LOUDLY — into a log nobody reads.
      # Two days passed before anyone noticed.
      #
      # ★★ NO `if: always()` HERE, and that is the whole point. The ledger's own
      # contract says it "records its last SUCCESSFUL run"; beating on failure
      # would keep the feed looking alive while it was broken — a dead-man switch
      # that reports health when the operator has stopped breathing. Only a real
      # success beats, so a failed day leaves the feed to go OVERDUE on
      # /api/v1/ops/deadman, which is exactly the signal that was missing.
      #
      # Fail-soft on the beat itself (`|| true`): a ledger outage must never turn
      # a healthy publish into a red run — the beat reports the work, it is not
      # the work.
      - name: Beat the dead-man ledger (success only)
        if: success()
        env:
          DCHUB_ADMIN_KEY: ${{ secrets.DCHUB_ADMIN_KEY }}
        run: |
          if [ -z "$DCHUB_ADMIN_KEY" ]; then
            echo "::warning::no DCHUB_ADMIN_KEY — cannot beat; this lane stays invisible on the dead-man board"
            exit 0
          fi
          curl -fsS -X POST "https://dchub.cloud/api/v1/admin/ingest-runs/beat" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: $DCHUB_ADMIN_KEY" \
            -H "User-Agent: dchub-smithery-freshness/1.0" \
            -d '{"feed":"smithery-freshness","status":"success","cadence_hours":24,
                 "note":"daily Smithery re-publish + listing convergence verified"}' \
            && echo "  ✓ beat recorded" || echo "::warning::beat failed (publish still succeeded)"

      # ★ 2026-08-22 — the listing COPY is owner-pasted and nothing compared it.
      # `smithery mcp publish` refreshes tools/verification; the `description`
      # Smithery serves is whatever was last pasted into the owner UI. On
      # 2026-08-21 the live text still advertised the DCGI (withdrawn 08-08),
      # "2,000+ tracked M&A deals" against a canon of 1,900+, "17,700+" data
      # centers against 18,500+, and "65 tracked feeds" against a live 70 — on
      # the ONE channel with measured volume (72.7% of external calls) — and
      # every monitor read green because none of them read that field.
      # This step reads it. scripts/smithery_description.txt is the single
      # origin (the quantity healer keeps its canon numbers current); a
      # mismatch is RED and names the owner action. UNREADABLE is not DRIFT:
      # an API failure warns and exits 0. Runs after the beat on purpose —
      # a copy mismatch must not make the publish lane read dead.
      - name: Listing copy equals scripts/smithery_description.txt (owner-pasted)
        if: always()
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request
          REG = "https://registry.smithery.ai/servers/azmartone67/dchub"
          want = open("scripts/smithery_description.txt", encoding="utf-8").read()
          norm = lambda t: re.sub(r"\s+", " ", t.replace("\\&", "&")).strip()
          try:
              req = urllib.request.Request(REG, headers={"User-Agent": "dchub-smithery-freshness-verify/1.0"})
              live = (json.load(urllib.request.urlopen(req, timeout=30)).get("description") or "")
          except Exception as e:
              print(f"::warning::registry unreadable ({e}) — listing copy UNMEASURED, not drift"); sys.exit(0)
          if not live.strip():
              print("::warning::registry served an empty description — UNMEASURED"); sys.exit(0)
          stale = [m for m in (r"\bDCGI\b(?![^.]*withdrawn)", r"\b\d+ tracked feeds\b") if re.search(m, live, re.I)]
          if norm(live) == norm(want) and not stale:
              print(f"::notice::Smithery listing copy matches scripts/smithery_description.txt ({len(live)} chars)"); sys.exit(0)
          print("::error::Smithery listing DESCRIPTION drifted from scripts/smithery_description.txt"
                + (f" (stale markers in the live text: {stale})" if stale else "")
                + ". OWNER ACTION: open https://smithery.ai/servers/azmartone67/dchub -> Edit and paste "
                  "scripts/smithery_description.txt verbatim. The file is the single origin; the publish CLI "
                  "does not carry the description. This step stays red until the paste lands.")
          sys.exit(1)
          PY
