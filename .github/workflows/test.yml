name: MCP smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 13:00 UTC (after the dchub-backend doctor runs at 09:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        # npm ci so CI tests the SAME dependency tree the image ships.
        run: npm ci --no-audit --no-fund

      # r77 (2026-06-07): the live-API suite hits the 1-replica MCP behind CF and is
      # inherently flaky under burst (empty-body / "No session" / 429 / 503, esp.
      # mid-redeploy). A flaky hard gate erodes trust and blocks merges. So the
      # PURE-UNIT gating suite is the HARD gate (deterministic, no network); the
      # live-API suite runs INFORMATIONAL (non-blocking) — still executes + uploads
      # output for diagnostics, but transient live blips don't fail the build. Set
      # the MCP_API_KEY repo secret to a valid ENTERPRISE key for the live suite.
      # ★2026-08-05: smithery-canon-guard was added to this line because NOTHING
      # ran it. `npm test` (whole suite) is invoked by no workflow, and this gate
      # names its files explicitly — so the guard's must-fail controls, the ones
      # that exist to prove the drift check can be made to fail, had never
      # executed in CI. A control that never runs certifies nothing; that is the
      # same silent-green shape the canon guard itself was written to catch.
      # It qualifies for the HARD gate on the stated criterion: deterministic,
      # no network (it shells out to sync-tools-manifest.mjs, which reads only
      # committed files) — and it restores every file it mutates.
      # ★2026-08-05 (r-cohort): execute-plan-cohort is named here for the SAME
      # reason smithery-canon-guard was added a few hours earlier — this gate
      # lists its files explicitly and `npm test` is invoked by no workflow, so
      # a new test file is dead on arrival unless it is added to this line. The
      # cohort guard's whole job is to prove the experiment tag cannot reach the
      # planner; a guard that never executes proves nothing. Qualifies for the
      # HARD gate: deterministic, no network (pure exported functions plus a
      # read of the committed server.mjs), mutates nothing.
      # ★2026-08-07 (r-go-click): go-checkout-link is named here for the THIRD
      # time this rule has had to be restated — a test file this gate does not
      # list is never executed by anything, since `npm test` is invoked by no
      # workflow. Its subject is the checkout link itself, so a silently
      # unexecuted guard here would let a broken link ship as green. Qualifies
      # for the HARD gate: deterministic, no network (pure exported function).
      # ★2026-08-12 (r-oauth-first): oauth-first-copy is named here for the
      # FOURTH restatement of this rule — `npm test` is invoked by no workflow
      # and this gate lists its files explicitly, so an unlisted test file is
      # dead on arrival. Its subject is the honesty of the identity
      # recommendation itself: the assertions that OAuth's human cost and its
      # "not offered to your client" caveat travel WITH the recommendation, and
      # that the keyless free tier is not quietly traded away for identity
      # capture. A silently unexecuted guard here would let copy ship that
      # sends unchallenged agents hunting for a door that does not open for
      # them. Qualifies for the HARD gate: deterministic, no network (reads
      # only the committed server.mjs), mutates nothing. Mutation-proven red on
      # 4 controls before merge (anti-wall clause, durable-key overclaim,
      # keyless promise, and a missing-anchor vacuity check that ERRORS rather
      # than passing on an empty slice).
      # ★2026-08-12 (r-mpp-guards): FIFTH restatement — and the widest miss yet.
      # An audit of the agent-pay rail found that NOT ONE of its guards had ever
      # executed in CI: mpp-consent, mpp-onestep, mpp-prewall, wall-exits and
      # human-relay-artifact were all absent from this line, and `npm test` is
      # invoked by no workflow. 60 test files exist; this gate ran 7 of them.
      #
      # That is the worst place in the repo to have unexecuted guards. This rail
      # settles against a LIVE Stripe key, so its failure mode is not a broken
      # link or stale copy — it is money moving for a caller who never opted in,
      # or an advertised price the gate cannot honour. The consent invariant in
      # particular ("no opt-in, no charge") is the one assertion that must never
      # be allowed to rot silently.
      #
      # All five qualify for the HARD gate on the stated criterion: deterministic
      # and no external network. mpp-onestep / mpp-prewall stand up a local
      # 127.0.0.1 stub sidecar; the rest read only committed source and exported
      # pure functions. Verified 3 consecutive identical runs (51 passed) before
      # merge, and each was mutation-proven red on the real run path.
      # ★2026-08-12 (r-mpp-abandonment): SIXTH restatement — mpp-funnel-split is
      # named here because a file this gate does not list is executed by nothing
      # (`npm test` is invoked by no workflow). Its subject is the agent-pay
      # funnel's counter-to-event mapping: that the caller-returned-a-credential
      # event has its own counter, that PAID cannot fire on the verify-FAILURE
      # branch, and that quote ISSUANCE is never counted as a return. Those are
      # exactly the confusions that produced a wrong public read of the funnel
      # ("13 agents reached the pay step" for 13 quotes that were merely issued),
      # so an unexecuted guard here would let the counters silently re-merge.
      # Qualifies for the HARD gate: deterministic, no network (pure exported
      # canon plus brace-depth containment over the committed server.mjs),
      # mutates nothing. Mutation-proven red on 10 mutations of the real run
      # path — including three that keep exactly one call site and only MOVE it
      # into the wrong branch, so the containment logic itself is exercised and
      # not just the anchor count — plus a vacuity control that ERRORS when its
      # anchor is missing rather than passing on an empty slice.
      #
      # ★2026-08-12 (r-mpp-receipt-replay): mpp-receipt-replay added ON THE SAME
      # COMMIT as the code it guards — this line is the whole reason a guard runs
      # at all, and a new agent-pay guard that is not on it has never executed.
      # Its subject is the retry defect: a caller charged EXACTLY ONCE and
      # answered ZERO times because Stripe's correct dedupe was turned into
      # payment_failed with no data. The guards pin (i) the call digest that
      # scopes a payment to ONE call, (ii) that an already-paid failure never
      # collapses into generic payment_failed, and (iii) that a replay is NOT
      # re-booked as revenue. Deterministic, 127.0.0.1 stub sidecar only, no
      # Stripe, no money. Mutation-proven red on 7 controls before merge.
      #
      # ★UNION NOTE (rebase of #178 onto #177/#179): both restatements above
      # added a file to THIS list, and the list is the only thing that makes a
      # guard execute. Dropping either name would silently disarm that guard, so
      # mpp-funnel-split AND mpp-receipt-replay are both named below.
      #
      # ★2026-08-12 (r-front-door-routing): SEVENTH restatement — and this one
      # shipped disarmed. front-door-routing-descriptions landed with #179 and
      # was on NO workflow line at all: all 15 files under .github/workflows/
      # matched it zero times, so from the moment it merged it had never once
      # executed. The guard itself is fine — stripping the 126-char stay-direct
      # clause out of get_energy_prices ("... get_energy_prices IS the right
      # call — one round trip, no planner overhead.") takes the anchor count
      # from 6 to 5 and turns the assertion at line 73 red. It simply never ran.
      #
      # Its subject is the anti-gaming half of the routing copy. Half (1), that
      # the lookup-heavy tools name execute_plan, is the half a metric-gaming
      # rewrite also satisfies — push EVERY call through the planner and the
      # workflow ratio climbs while agents get slower (measured: ~3 steps and
      # ~2.3s on an intent rank_markets answered alone in ~0.6s). Half (2), that
      # each tool still says when the direct call is right, is the only thing
      # separating the honest fix from the gamed one, and it is exactly the
      # clause a well-meaning promotional edit deletes first. Unexecuted, that
      # distinction was being certified by nothing.
      # Qualifies for the HARD gate: deterministic, no network (reads the
      # committed server.mjs plus one exported table), mutates nothing. Proven
      # to actually run IN CI on this PR, not merely locally — a red run on a
      # deliberate mutation of that clause, then green on its revert.
      # ★2026-08-17 (r-sandbox) — READ THIS BEFORE ADDING A FILE-MUTATING TEST
      # TO THIS LINE. vitest runs these files in PARALLEL workers. Several of
      # them readFileSync server.mjs at module load and assert on its source,
      # and smithery-canon-guard used to mutate-and-restore server.mjs (~1 MB)
      # in the shared working tree. Measured at 3e73cd0: a sampler reading
      # server.mjs alongside six canon-guard runs saw the guard's transient
      # "190+ countries" / "12,650+ … facilities" strings in 307 of 8,233
      # samples, and saw the file at ZERO BYTES once (writeFileSync opens
      # O_TRUNC, then writes). anon-seat-fence went red on that in 2 of 3
      # full-suite runs; 0 of 3 after the fix. Same shape as PR #180, run
      # 31653502482 (execute-plan-cohort: "expected -1 to be greater than -1",
      # green on `gh run rerun --failed` at the identical commit).
      # The flake was the mild half; a clobbered mutation also makes the canon
      # guard's must-fail controls pass VACUOUSLY, which ships real drift green.
      # The gate stays parallel because the mutation moved off the shared tree
      # entirely — see test/helpers/repo-sandbox.mjs. Any new test here that
      # writes to disk MUST use createRepoSandbox(); smithery-canon-guard has a
      # control that fails the gate if another test file calls an fs write.
      # ★2026-08-28 (r-dead-guards): EIGHTH restatement — and it is no longer a
      # miss, it is a CLASS. An audit enumerated every test/*.test.mjs against
      # every file under .github/workflows/ and found FIFTEEN that no workflow
      # mentions at all. `npm test` is invoked by no workflow, so all fifteen
      # had never executed in CI a single time — 147 assertions certifying
      # nothing. The seven restatements above each fixed one instance of this
      # by hand; the pattern outran them because nothing enumerates the gap.
      #
      # Two of the fifteen guard the Claude-connector CHALLENGE itself
      # (challenge-after-n, challenge-bound-and-widen) — the machinery whose
      # misreading has now cost several sessions of manual re-derivation. The
      # bound guard's whole subject is that a caller cannot be re-challenged
      # without limit, which is the exact retry-loop behaviour that inflated
      # the 4,356-challenge figure into a phantom "blocked cohort". A third,
      # mpp-payment-required-actionable, is on the LIVE-Stripe rail this file
      # already calls the worst place in the repo to have unexecuted guards.
      #
      # All fifteen qualify for the HARD gate on the stated criterion: none of
      # them writes to disk (checked explicitly — the r-sandbox flake above is
      # a file-mutation hazard and does not apply), and each either reads
      # committed source, calls exported pure functions, or stands up a local
      # 127.0.0.1 stub. Verified green BEFORE arming: 81 files / 1049 tests on
      # the existing line, then 96 files / 1196 tests on this one, three
      # consecutive identical runs (+147, matching the fifteen run alone).
      #
      # ★If you add a test file, add it HERE in the same commit. A file this
      # line does not name is dead on arrival, and it fails SILENTLY GREEN.
      # ★2026-08-28 (r-claude-arrivals): claude-arrival-counter is named here in
      # the SAME commit as the code it guards — the rule immediately above, applied
      # rather than restated. Its subject is the passive arrival counter, whose
      # three load-bearing properties are all invisible to a canon-only test: that
      # it fires OUTSIDE the 401 branch, that it carries NO hasSession bail, and
      # that it is not gated on the challenge being enabled. Mutation-proven red on
      # 6 mutations of the real run path, each confirmed present on disk by grep
      # before the run was trusted, and server.mjs byte-identical afterward.
      # ★2026-08-29 — three files added to this line. They were written for
      # mcp #248 (get_grid_intelligence inventing an ISO code) and #249 (the
      # empty required[]) and then, for two of them, sat OUTSIDE this line for
      # a day: green locally, executed by nothing. That is the trap this whole
      # comment block exists for, and it caught its own authors. If you add a
      # test file to this repo, add it HERE in the same commit or it certifies
      # nothing. All three qualify: deterministic, no outbound network
      # (required-args boots the app on 127.0.0.1 and points DCHUB_API_BASE at
      # an unroutable port, the same pattern capacity-context already uses on
      # this line), and none mutates a file.
      # ★2026-08-30 — FOUR files added to this line, and the reason is not that
      # they were missing from it. They were named in the INFORMATIONAL step
      # below, which carries continue-on-error: true, so every assertion in them
      # could go red while `smoke` reported SUCCESS. That is how mcp #262 shipped
      # a version drift: it bumped package.json / server.json / mcp-server.json /
      # smithery.yaml to 2.12.1, missed server.mjs, and the guard whose header
      # reads "Fail the build if the five publish surfaces disagree" went red
      # without blocking. The running server then identified as 2.12.0 on both
      # surfaces it controls while the official registry served 2.12.1 as
      # isLatest — for four days and four PRs.
      #
      # ★THE SHAPE, worth more than the instance: this step boundary is drawn by
      # FILE, but "can this fail the build" is a property of the ASSERTION. Two
      # of these files (liveness-claim, registry-schema-limits) already put their
      # network halves behind `describe.runIf(LIVE_PROBE === '1')` and say so in
      # their headers — they became deterministic and nobody moved them. The
      # files changed underneath a boundary that was drawn once. LIVE_PROBE is
      # set NOWHERE in .github, so those halves stay skipped here; verified by
      # grep, not assumed. version-consistency and funnel-invariants were carved
      # out of regression.test.mjs, which is genuinely live and stays below.
      #
      # ★And do NOT reach for `vitest -t "<name>"` to gate one describe inside a
      # mixed file. Measured: `vitest run <file> -t "<no-match>"` exits 0 — a
      # name-scoped gate certifies nothing the moment the describe is renamed.
      # That is the same vacuous-green this whole comment block exists about.
      #
      # ★Whatever is added here must stay deterministic. dchub-backend #3361 (a
      # day earlier) had to UNDO the opposite mistake: a pinned tool-count gate
      # that POSTed production sat on the pre-merge path, so a network blip — or
      # production gaining tool 83 — reddened every open branch with no commit
      # responsible. Blocking and networked are the two things a gate cannot be
      # at once.
      # ★2026-09-03 (r-delete-third-callsite): delete-session-third-callsite
      # is named here, and this is the first restatement that did NOT have to be
      # found by hand — test/every-test-file-runs.test.mjs (added 2026-08-28 for
      # exactly the class this comment block keeps re-litigating) failed with the
      # filename in its diff the moment the file existed unlisted. The mechanical
      # guard now does what eight hand restatements could not.
      # Qualifies for the HARD gate: deterministic, and its "network" is an
      # ephemeral 127.0.0.1 listener over the real express app — no egress, the
      # same shape origin-edge-key.test.mjs already runs here. It must drive real
      # HTTP because the defect is invisible to a unit test of the handler body:
      # Express 4 swallowing an async rejection produces NO RESPONSE, and only a
      # real request with a client deadline can tell a hang from a 500.
      - name: Unit gate — gating logic (HARD gate, no network)
        run: npx vitest run test/edge-key-flip-evidence.test.mjs test/composite-shell.test.mjs test/anchor-contract.test.mjs test/anon-seat-fence.test.mjs test/citation-shape-contract.test.mjs test/claude-challenge-method.test.mjs test/connect-url-install-artifact.test.mjs test/constraint-iso-shape.test.mjs test/coord-aliases.test.mjs test/discovery-coverage.test.mjs test/end-of-burst-hook.test.mjs test/error-envelope.test.mjs test/execute-plan-invariants.test.mjs test/fiber-bucket-contract.test.mjs test/front-door-nudge.test.mjs test/generic-clientinfo-attribution.test.mjs test/github-description-canon.test.mjs test/github-description-push-behaviour.test.mjs test/honest-tier.test.mjs test/continuation.test.mjs test/hosting-capacity.test.mjs test/human-line-first.test.mjs test/incentives-class.test.mjs test/instructions-canon-parity.test.mjs test/instructions-compose.test.mjs test/instructions-selftest-pointer.test.mjs test/late-key.test.mjs test/leaf-catchment.test.mjs test/manifest-description-heals.test.mjs test/monthly-quota-gateway.test.mjs test/mpp-arg-channel.test.mjs test/mpp-covered-tools-exist.test.mjs test/mpp-undercap.test.mjs test/payload-diet.test.mjs test/place-name-iso.test.mjs test/plan-query.test.mjs test/planner-eval.test.mjs test/planner-geography-scope.test.mjs test/platform-header.test.mjs test/platform-recall.test.mjs test/portfolio-nudge.test.mjs test/power-timeline-class.test.mjs test/problem-taxonomy.test.mjs test/quota-meter-charged.test.mjs test/recipe-lifecycle.test.mjs test/registry-reflex-honesty.test.mjs test/registry-verify-listed.test.mjs test/resolution-gap.test.mjs test/result-shaping.test.mjs test/save-site-coords.test.mjs test/schema-optionality.test.mjs test/scoreboard-freshness.test.mjs test/server-json-route.test.mjs test/smithery-first-touch.test.mjs test/starter-pack.test.mjs test/time-to-power-one-name.test.mjs test/tool-maturity-annotation.test.mjs test/toplevel-attribution.test.mjs test/upstream-error-contract.test.mjs test/uncovered-constraints.test.mjs test/gating.test.mjs test/one-human-cta.test.mjs test/typed-preview-rank-markets.test.mjs test/oauth.test.mjs test/platform-desc-sync.test.mjs test/smithery-canon-guard.test.mjs test/execute-plan-cohort.test.mjs test/go-checkout-link.test.mjs test/oauth-first-copy.test.mjs test/mpp-consent.test.mjs test/mpp-onestep.test.mjs test/mpp-prewall.test.mjs test/mpp-funnel-split.test.mjs test/mpp-receipt-replay.test.mjs test/wall-exits.test.mjs test/human-relay-artifact.test.mjs test/front-door-routing-descriptions.test.mjs test/retired-claims.test.mjs test/free-key-arbitrage.test.mjs test/invalid-bearer.test.mjs test/hyperscaler-deals-schema.test.mjs test/return-affordance-anon.test.mjs test/ci-selftag.test.mjs test/wall-transport.test.mjs test/schema-dialect-neutral.test.mjs test/no-live-dcgi-claims.test.mjs test/anon-attribution.test.mjs test/capacity-context.test.mjs test/challenge-after-n.test.mjs test/challenge-bound-and-widen.test.mjs test/deterministic-install.test.mjs test/exec-step-budget.test.mjs test/instructions-constraint-coverage.test.mjs test/invalid-param-hint.test.mjs test/mpp-payment-required-actionable.test.mjs test/named-constraint-routing.test.mjs test/persist-config-vscode.test.mjs test/persist-config-gemini.test.mjs test/registry-publish-ref-gated.test.mjs test/request-interpretation.test.mjs test/selection-triggers.test.mjs test/typed-iso-is-scope.test.mjs test/upstream-error-iserror.test.mjs test/claude-arrival-counter.test.mjs test/grid-region-unresolved.test.mjs test/required-args.test.mjs test/interconnection-queue-shape.test.mjs test/coverage-counts-not-masked.test.mjs test/fields-projection.test.mjs test/geography-arg-parity.test.mjs test/auth-source.test.mjs test/routing-hint.test.mjs test/step-slim-keeps-honesty.test.mjs test/licence-coherence.test.mjs test/smithery-reclaim-terms.test.mjs test/anon-hard-wall.test.mjs test/summarize-citation.test.mjs test/version-consistency.test.mjs test/funnel-invariants.test.mjs test/liveness-claim.test.mjs test/registry-schema-limits.test.mjs test/every-test-file-runs.test.mjs test/analyst-path-selftag.test.mjs test/arg-aliases.test.mjs test/one-of-required.test.mjs test/as-of-record-scope.test.mjs test/claude-passive-arrivals.test.mjs test/invalid-key-anon.test.mjs test/recommendation-returns-contract.test.mjs test/recommendation-returns-truth.test.mjs test/toolspec-is-real.test.mjs test/handler-args-declared.test.mjs test/registry-cron-order.test.mjs test/analyze-site-location.test.mjs test/site-headline-envelope.test.mjs test/named-absence.test.mjs test/snapshot-repairs-missing-keys.test.mjs test/comparison-symmetry.test.mjs test/full-cap-enforce.test.mjs test/tool-description-honesty.test.mjs test/edge-gate-recognition.test.mjs test/glama-build-provenance.test.mjs test/glama-placement-probe.test.mjs test/init-clientinfo-version-error.test.mjs test/structured-content-mirrors-payload.test.mjs test/free-tier-claims.test.mjs test/registry-discover-scaffold.test.mjs test/registry-refresh-gate.test.mjs test/smithery-freshness-ledger.test.mjs test/smithery-credential-fallback.test.mjs test/held-key-persists.test.mjs test/oauth-funnel-stages.test.mjs test/founding-visible-and-go-links.test.mjs test/origin-edge-key.test.mjs test/session-release-covers-every-map.test.mjs test/delete-session-third-callsite.test.mjs test/rank-defense-staging.test.mjs test/agent-beat.test.mjs test/live-suite-opt-in.test.mjs test/gitignore-patterns-bite.test.mjs test/no-push-to-protected-main.test.mjs test/write-tool-annotation-accuracy.test.mjs

      # ★2026-09-01: this step ran ANONYMOUS for as long as MCP_API_KEY was
      # unset. GitHub renders an unset secret as the empty string, so the env
      # line below looked right in the YAML and right in the run log
      # ("MCP_API_KEY:" with nothing after it) while the suite authenticated
      # as nobody.
      #
      # MEASURED 2026-09-01 on the smoke run for #297:
      #   mcp.test.mjs         16 tool calls
      #   regression.test.mjs  41 tool calls
      #   ────────────────────────────────────
      #   per run              57
      #   anonymous allowance   5 / day   (canonical/tier_limits.json)
      #
      # So 52 of 57 calls — 91% — executed past the daily wall. isGated() in
      # regression.test.mjs recognises paid_only, trial_preview, _upgrade,
      # 429/5xx and rate-limit strings, but NOT the daily-quota wall, so an
      # exhausted call is reported as a PRODUCT failure. That is how
      # search_facilities came to look like it served a broken response shape
      # when a direct call returns exactly the documented {data, success}.
      #
      # ★ WHY NO TEST GUARDS THIS. The YAML was never wrong. It named the right
      # secret in the right place for months; only the secret was absent. A
      # guard reading this file would have passed throughout — the shape was
      # right and the behaviour was wrong, which is exactly the class of defect
      # a source-level check cannot see. Only a run reveals it.
      #
      # ★ ON `||`, because this repo has a scar there. #289 established that
      # `secrets.A || secrets.B` resolves to the first NON-EMPTY secret, so a
      # dead-but-present token wins the expression and blocks the fallback.
      # This is the opposite case: MCP_API_KEY is EMPTY, the one situation
      # `||` resolves correctly. If someone later sets MCP_API_KEY it takes
      # precedence — and if that key is dead, or below Starter tier, this step
      # degrades silently again exactly as REPO_ADMIN_TOKEN did. The tier
      # matters, not just the presence.
      #
      # DC_HUB_API_KEY is Developer tier (500/day) = ~8 runs/day of headroom.
      - name: Live MCP suite — informational (non-blocking)
        continue-on-error: true
        env:
          MCP_URL: https://dchub.cloud/mcp
          MCP_API_KEY: ${{ secrets.MCP_API_KEY || secrets.DC_HUB_API_KEY }}
        run: npx vitest run test/mcp.test.mjs test/regression.test.mjs

      - name: Upload live-suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output-${{ github.run_id }}
          path: |
            test/
          retention-days: 14
