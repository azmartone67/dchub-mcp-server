name: chatgpt-test-cases
# Runs the 5 ChatGPT directory test cases + /plans and /terms from a GitHub
# runner IP (not a laptop). Manual, plus one run per push touching these files.
on:
  workflow_dispatch:
    inputs:
      path:
        description: MCP path to test
        default: /mcp/chatgpt
  push:
    paths:
      - scripts/chatgpt-test-cases.mjs
      - .github/workflows/chatgpt-test-cases.yml
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run test cases 1-5
        run: node scripts/chatgpt-test-cases.mjs --path "${{ inputs.path || '/mcp/chatgpt' }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chatgpt-test-cases-result
          path: chatgpt-test-cases-result.json
