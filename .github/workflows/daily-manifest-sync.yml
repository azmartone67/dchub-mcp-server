name: daily manifest + README sync

# DAILY self-heal of the tool count / version across the registry-facing SOURCE
# files (README.md, smithery.yaml, mcp-server.json, server.json) from server.mjs — the single
# source of truth. Glama, PulseMCP and the GitHub MCP Registry scrape these source
# files, so keeping them accurate every day keeps every listing current with no
# manual edits.
#
# Why this exists (2026-06-25): the GitHub MCP Registry listing drifted to
# "48 MCP tools" while the live server had 49. Nothing auto-synced the README
# prose, and the drift guard's regex matched "N tools" but not "N MCP tools",
# so CI never caught it. This job + the widened regex close that gap.
#
# Companion crons: smithery-freshness (daily, re-scans the LIVE server) and
# registry-refresh (weekly publish + honest-numbers guard).

on:
  schedule:
    - cron: '41 13 * * *'     # DAILY 13:41 UTC (offset from smithery 14:23 / registry-refresh Mon 06:30)
  # 2026-08-13: external refresh hook. Every listing target that is not a
  # PR-submit has to be poked from OUTSIDE the repo — a registry UI, a cron
  # elsewhere, or a human with a curl. There was no such entry point: both sync
  # workflows were schedule + manual-only, so an external service asking to
  # trigger a refresh had nothing to call. Payload is ignored; the job always
  # does the same full heal.
  #   curl -X POST -H "Authorization: Bearer $GH_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/azmartone67/dchub-mcp-server/dispatches \
  #     -d '{"event_type":"refresh-listings"}'
  repository_dispatch:
    types: [refresh-listings]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # gh pr create/merge — main is PR-only, never pushed
  # ★2026-08-11 — NO permission key can grant the repo-DESCRIPTION write.
  # `administration` is not a valid Actions permissions key (the schema accepts
  # actions/attestations/checks/contents/deployments/discussions/id-token/
  # issues/packages/pages/pull-requests/repository-projects/security-events/
  # statuses) — adding it made this whole workflow UNPARSEABLE and took the
  # daily canon heal down with it, for a step that could never have worked
  # anyway. Repo metadata is outside GITHUB_TOKEN's reach entirely; it needs a
  # PAT. See the push step below.

concurrency:
  group: daily-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: "npm"
      # ★2026-09-01 — this job USED to push with [skip ci], so NOTHING ever tested
      # what it shipped. (It now opens a PR instead — see the commit step — so CI
      # does run on the result. The history below is why the in-job hard gate is
      # still here: it is now a second line of defence rather than the only one.)
      # On 2026-09-01 it healed canon 19,900+ -> 20,100+ and left main
      # RED on the hard gate for a day: test/github-description-push-behaviour.test.mjs
      # derived its "stale" fixture by substituting the literal '19,900+', which
      # after the heal matched nothing, so the fixture became identical to canon and
      # nine drift tests were handed a no-drift input. Nobody saw it, because
      # [skip ci] is exactly the instruction not to look.
      #
      # The fixtures are fixed, but a bot that ships unverified will find the next
      # one. So it installs deps and runs the same HARD gate before opening the PR:
      # failing here leaves the drift unhealed and loud, which beats opening a PR
      # that CI will only reject after the fact.
      - name: Install deps (so the heal can be verified before it ships)
        run: npm ci --no-audit --no-fund
      - name: Refresh canonical phrase quantities from the owner endpoint
        # ★2026-07-30: pulls /api/v1/canon/phrases (the SAME owner the
        # dchub-frontend heal reads) into canonical/canon_phrases.json.
        # Fail-closed — on any fetch/validation failure it logs and leaves the
        # committed snapshot in force, so a backend blip can never move canon.
        run: node scripts/refresh-canon-phrases.mjs
      - name: Push the healed GitHub repo description
        # ★2026-08-11 — THE SURFACE NO FILE-WALKING GUARD COULD SEE.
        #
        # This job's own header says it heals the "source files" that Glama,
        # PulseMCP and the GitHub MCP Registry scrape. The repo DESCRIPTION is
        # scraped by all of them and is not a file — it is GitHub metadata. So
        # `git grep 16,900` returned nothing, COVERAGE could not list it, and
        # it sat at "16,900+ facilities" against a canon of 17,300+ until a
        # third-party listing copied it in good faith and inherited the drift.
        #
        # canonical/github_description.txt is now healed by the same engine as
        # every other surface (same rules, one place). This step is the only
        # new part: push those bytes to the metadata field.
        #
        # FAIL-SOFT, like every other step here: no token permission, an API
        # error, or an over-long description logs the exact manual command and
        # exits 0. A metadata blip must never fail the daily heal.
        env:
          # ★2026-08-31 — WHY THIS IS THREE VARIABLES AND NOT ONE `||` CHAIN.
          #
          # This was `GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}`
          # doing BOTH the read and the write. The 2026-08-31 run log:
          #
          #     HAVE_PAT: true
          #     HTTP 401: Bad credentials (https://api.github.com/graphql)
          #     [gh-desc] DRIFT: the published description does not match canon.
          #     [gh-desc]   live:
          #     [gh-desc] PUSH FAILED despite a PAT
          #
          # REPO_ADMIN_TOKEN is CONFIGURED but DEAD. Three defects fell out of
          # that one line, and the step exited 0 through every one of them, so
          # the job stayed green and nobody saw it. Meanwhile the About field —
          # the surface this step exists to keep honest — sat at "19,700+
          # facilities" against a canon of 19,900+ and was healed by the OTHER
          # step at the bottom of this file, which regex-heals three named
          # numbers rather than pushing the whole canonical string.
          #
          #  1. `||` picks the first NON-EMPTY secret, never the first WORKING
          #     one. A dead PAT wins the expression and takes the step with it,
          #     so adding a healthy fallback secret would NOT have helped. The
          #     write token is now chosen at RUNTIME, by authenticating.
          #  2. The dead PAT was also doing the READ, so `gh repo view` 401'd,
          #     `|| echo ''` swallowed it, LIVE became "" — and "" never equals
          #     canon, so the step reported DRIFT unconditionally, with a blank
          #     `live:` line, every day, whatever the field actually said. A
          #     check that cannot see its subject must report UNKNOWN, not a
          #     verdict. Reading is `metadata: read`, which GITHUB_TOKEN always
          #     has, so the drift REPORT no longer depends on a PAT at all.
          #  3. It called a 401 a scope problem — sending a reader to audit a
          #     token that is not under-scoped but expired. 401 (dead) and 403
          #     (under-scoped) are now named separately, because they have
          #     different fixes.
          #
          # GITHUB_TOKEN CANNOT do the write: repo metadata is outside every
          # Actions permission, which is why the first attempt at this step
          # (`administration: write`) was not merely wrong but UNPARSEABLE.
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.REPO_METADATA_TOKEN || secrets.REGISTRY_PR_PAT }}
        run: |
          DESC="$(cat canonical/github_description.txt)"

          # READ with GITHUB_TOKEN, and keep a failed read DISTINCT from a
          # drift verdict — conflating them is what produced a year of blank
          # `live:` lines that looked like findings.
          if ! LIVE="$(GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY" \
                         --jq '.description // ""' 2>/tmp/gh-desc-read.err)"; then
            echo "::warning::[gh-desc] UNKNOWN — cannot READ the published description, so drift is undetermined. This is NOT 'in sync' and NOT 'drifted':"
            sed 's/^/[gh-desc]   /' /tmp/gh-desc-read.err || true
            exit 0
          fi

          if [ "$DESC" = "$LIVE" ]; then
            echo "[gh-desc] in sync — no push needed"
            exit 0
          fi
          if [ "${#DESC}" -gt 350 ]; then
            echo "::warning::[gh-desc] REFUSING: ${#DESC} chars exceeds GitHub's limit — shorten the file"
            exit 0
          fi
          echo "[gh-desc] DRIFT: the published description does not match canon."
          echo "[gh-desc]   live: $LIVE"
          echo "[gh-desc]   want: $DESC"

          # WRITE — try each configured PAT and keep the first that
          # AUTHENTICATES, which is the decision `||` could not make.
          PUSHED=no
          for VAR in PRIMARY_TOKEN FALLBACK_TOKEN; do
            TOK="${!VAR}"
            [ -n "$TOK" ] || continue
            if ERR="$(GH_TOKEN="$TOK" gh api -X PATCH "repos/$GITHUB_REPOSITORY" \
                        -f description="$DESC" 2>&1 >/dev/null)"; then
              echo "::notice::[gh-desc] pushed via $VAR — About now matches canon; Glama and other About-mirroring listings re-scan on their own cadence."
              PUSHED=yes
              break
            fi
            case "$ERR" in
              *401*|*"Bad credentials"*)
                echo "::warning::[gh-desc] $VAR is INVALID or EXPIRED (401). Reissue the PAT — auditing its scopes will find nothing wrong." ;;
              *403*|*404*)
                echo "::warning::[gh-desc] $VAR authenticated but was REFUSED (403/404) — it lacks repo 'Administration: write' (fine-grained) or classic 'repo' scope." ;;
              *)
                echo "::warning::[gh-desc] $VAR failed: $ERR" ;;
            esac
          done

          if [ "$PUSHED" != yes ]; then
            echo "::warning::[gh-desc] PUSH FAILED with every configured token — the About field stays stale and every listing that mirrors it inherits the stale figure."
            echo "[gh-desc] Fix now:  gh api -X PATCH repos/$GITHUB_REPOSITORY -f description=\"\$(cat canonical/github_description.txt)\""
            echo "[gh-desc] Automate: set REPO_ADMIN_TOKEN to a LIVE PAT with repo 'Administration: write'"
          fi
      - name: Refresh the canonical problem taxonomy from the owner endpoint
        # ★2026-07-31: pulls /api/v1/canon/taxonomy (owner: dchub-backend
        # routes/problem_taxonomy.py) into canonical/problem_taxonomy.json.
        # Same fail-closed contract as the phrases refresh — a backend blip
        # can never move the scope lists.
        run: node scripts/refresh-problem-taxonomy.mjs
      - name: Refresh per-tool maturity + coverage limits from the owner endpoints
        # ★2026-08-12: pulls /api/v1/canon/coverage (owner: dchub-backend
        # routes/problem_taxonomy.py) and the measured deferrals from
        # /api/v1/reports/canonical-benchmarks into canonical/tool_maturity.json,
        # which server.mjs derives every tool's maturity/limits annotation from.
        # Same fail-closed contract: a backend blip keeps the committed
        # snapshot rather than half-writing one — an empty deferred list is the
        # FLATTERING state (it demotes nobody), so it must never arrive by
        # accident.
        run: node scripts/refresh-tool-maturity.mjs
      - name: Refresh the canonical per-tier daily call ladder
        # ★2026-08-23: this repo advertised the free tier as 10 calls/day (x12),
        # 50/day AND 100/day — three numbers for one product — against a canon
        # (tier_registry.TIER_LIMITS, served at /api/v1/tiers) that says
        # anonymous=5 since 2026-08-03. Same fail-closed contract as the two
        # refreshes above: a backend blip keeps the committed snapshot rather
        # than half-writing one, because a bad snapshot would move every
        # published claim at once. test/free-tier-claims.test.mjs gates on it.
        run: node scripts/refresh-tier-limits.mjs
      - name: Regenerate toolspec.json from the live tools/list
        # toolspec.json is in the COVERAGE list below, so this job healed the
        # phrase QUANTITIES inside it every day while the tool list itself sat
        # at 79 tools with zero declared properties — a partially healed surface
        # reading more current than an untouched one (#269's shape). This step
        # owns the tools; sync-tools-manifest owns the numbers. Fails CLOSED:
        # any transport error, or a result as vacuous as what it replaces,
        # leaves the file untouched and exits 0.
        run: node scripts/refresh-toolspec.mjs

      - name: Sync tool count + version + canon quantities into every owned surface
        run: node scripts/sync-tools-manifest.mjs --fix
      - name: Commit + open a PR only if a surface drifted
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # ★2026-07-30: ONE list of every file the refresh + --fix can write,
          # used for BOTH the drift gate and the stage. The dchub-frontend heal
          # (07-28) computed fixes for three pages and then DISCARDED them
          # because they were missing from the workflow's commit list — a heal
          # that writes a file this list omits is a no-op with a green log.
          # server.mjs is deliberately included: quantity heals there push to
          # main and Railway redeploys the gateway with the corrected figures.
          # ★2026-08-05: the seven entries in the second block below were MISSING,
          # and the warning above had come true again — verbatim. --fix wrote all
          # seven every single day ("wrote: … integrations/gemini/README.md,
          # dchub_mcp_server.py, toolspec.json …"), this list omitted them, so
          # `git add $OWNED` discarded the heal every time and the job logged a
          # green "✓ healed registry surfaces". Net effect: those surfaces sat at
          # 16,300+ against a canon of 16,500+ and could never converge, which is
          # what turned smithery-canon-guard's "reports the committed tree as
          # clean" red on main. If you add a file to the heal, add it HERE.
          OWNED="README.md smithery.yaml mcp-server.json server.json package.json \
                 server.mjs canonical/canon_phrases.json canonical/problem_taxonomy.json \
                 canonical/tool_maturity.json \
                 llms-install.md REGISTRY-LISTINGS.md \
                 skills/README.md skills/dc-hub-data-center-intelligence/SKILL.md \
                 scripts/tier3_presence.sh scripts/smithery_description.txt \
                 integrations/README.md integrations/chatgpt/README.md \
                 integrations/chatgpt/openapi.json integrations/chatgpt/instructions.txt \
                 integrations/cohere/README.md integrations/copilot/dchub-mcp.yaml \
                 integrations/openrouter/tools.json dxt/manifest.json dchub.dxt \
                 docs/canonical-workflows.md docs/distribution-targets.md \
                 toolspec.json dchub_mcp_server.py TELEGEOGRAPHY-OUTREACH.md \
                 integrations/gemini/README.md integrations/openrouter/README.md \
                 integrations/langchain/dchub_tools.py \
                 integrations/llamaindex/dchub_tools.py \
                 canonical/github_description.txt canonical/tier_limits.json"
          # ★2026-08-05 UNOWNED-HEAL GATE. The comment above warned that a heal
          # writing a file this list omits is a no-op with a green log — and then
          # it happened here for seven files, undetected for days, because
          # nothing ever compared what --fix WROTE against what this list STAGES.
          # Maintaining two lists by hand is what failed; so compare them. Any
          # file the heal modified that $OWNED does not cover is a hard error,
          # not a silent discard.
          UNOWNED=$(comm -23 \
            <(git diff --name-only | sort -u) \
            <(printf '%s\n' $OWNED | sort -u))
          if [ -n "$UNOWNED" ]; then
            echo "::error::--fix modified files that \$OWNED does not stage, so this job would"
            echo "::error::silently DISCARD those heals and report success. Add them to \$OWNED:"
            printf '  %s\n' $UNOWNED
            exit 1
          fi
          if git diff --quiet -- $OWNED; then
            echo "✓ no drift — all registry surfaces already in sync"
            echo "server_json=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Did server.json (the OFFICIAL-registry publish source) change? If so the live
          # tool set drifted and we auto-publish a patch bump below.
          if git diff --quiet -- server.json; then echo "server_json=no" >> "$GITHUB_OUTPUT"; else echo "server_json=yes" >> "$GITHUB_OUTPUT"; fi
          echo "Surfaces drifted — healing:"; git --no-pager diff --stat -- $OWNED
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage ONLY the files this job owns (never -A)
          git add $OWNED
          # ★ Verify the HEALED tree before it ships. This used to be the ONLY
          #   opportunity, because [skip ci] meant no workflow ran on the commit.
          #   The PR now gets real CI, so this is no longer the last line — but it
          #   still runs first, so a bad heal never becomes an open PR at all.
          #   Fail CLOSED: leave the drift unhealed and say so, rather than push a
          #   tree that does not pass. An unhealed surface is visible and
          #   recoverable; a red main nobody is told about is neither.
          # The gate's file list is DERIVED from test.yml, never copied: a second
          # copy is a second thing to forget, and this job exists because a canon
          # value lived in two places. If the extraction comes back empty, fail —
          # `vitest run` with no files would sweep everything and could pass
          # vacuously, which is the silent-green this repo keeps re-learning.
          HARD_GATE=$(grep -oE 'npx vitest run test/[^"]*' .github/workflows/test.yml | head -1 | sed 's|^npx vitest run ||')
          if [ -z "$HARD_GATE" ]; then
            echo "::error::[verify] could not extract the hard-gate file list from test.yml."
            echo "::error::Refusing to push an unverified heal. Check that test.yml still has a"
            echo "::error::'npx vitest run test/…' line, and fix this extraction if it moved."
            exit 1
          fi
          echo "[verify] running the hard gate against the healed tree…"
          if ! npx vitest run $HARD_GATE > /tmp/heal-gate.log 2>&1; then
            echo "::error::[verify] the healed canon FAILS the hard gate — NOT pushing."
            echo "::error::The heal itself may be correct and a test may be pinned to the"
            echo "::error::previous canon value (that is what happened on 2026-09-01)."
            echo "::error::Fix the test or the heal, then re-run. Drift stays unhealed until then."
            tail -60 /tmp/heal-gate.log
            exit 1
          fi
          echo "[verify] hard gate green on the healed tree — opening a PR"
          # ★2026-09-04 — PR, NEVER PUSH. main is moving to required status
          # checks, and a direct push to a protected main is rejected with GH006
          # ("N of N required status checks are expected"). The backend learned
          # this the expensive way: mcp-facts-export.yml carries a comment
          # recording SEVENTEEN DAYS of daily red from exactly that, and the
          # remediation text it shipped with told readers the failure was
          # cosmetic, so the alarm was ignored the whole time.
          #
          # ★ NO [skip ci] MARKER, here or in the PR body. That marker is why
          # this job's output was never once tested — the comment at the top of
          # this file says so. dchub-mcp-server SQUASH-merges, which concatenates
          # commit bodies, so the literal token would ride into main's head
          # commit and skip CI there too. Letting CI run on the PR is the whole
          # point: these commits are exactly the ones that move canon.
          #
          # ★ set -euo pipefail is load-bearing. A push loop in this repo's sister
          # workflows ended with `done` and therefore exited 0 after failing every
          # attempt (fixed in dchub-frontend#1344) — three jobs reported SUCCESS
          # while their push to main was rejected. Here, any failure below fails
          # the step: a PR that cannot be opened must be LOUD, never a silent 0.
          BRANCH="bot/canon-sync-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$BRANCH"
          git commit -q -m "chore(canon): daily tool-count/version/quantity sync from server.mjs + canon snapshot"
          git push -q -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(canon): daily tool-count/version/quantity sync" \
            --body "Automated canon heal from \`daily-manifest-sync.yml\`. The hard gate was run against the healed tree in this job before the PR was opened; CI re-runs it here because that is the check main will require.")
          echo "opened $PR_URL"
          # --auto lands it once the required checks report. With no required
          # checks configured yet it merges immediately, which is the same
          # behaviour as the old direct push.
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "✓ healed registry surfaces via $PR_URL — Glama/PulseMCP/GitHub re-scan after merge"
      - name: Detect registry drift (is the LIVE registry behind server.json?)
        id: regdrift
        run: |
          LOCAL=$(node -p "require('./server.json').version")
          LIVE=$(curl -sS --max-time 20 \
            'https://registry.modelcontextprotocol.io/v0/servers?search=cloud.dchub' \
            | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{
                try{const j=JSON.parse(b);const v=(j.servers||[])
                  .map(s=>(s.server||{}).version).filter(Boolean)
                  .sort((a,c)=>{const p=x=>String(x).split('.').map(Number);
                    const A=p(a),C=p(c);for(let i=0;i<3;i++){if(A[i]!==C[i])return A[i]-C[i];}return 0;});
                console.log(v.length?v[v.length-1]:'0.0.0');}catch(e){console.log('');}})" || echo "")
          echo "local=$LOCAL live=$LIVE"
          if [ -z "$LIVE" ]; then
            echo "::warning::could not read the live registry — treating as UNKNOWN, not clean"
            echo "behind=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HIGHEST=$(printf '%s\n%s\n' "$LOCAL" "$LIVE" | sort -V | tail -1)
          if [ "$LIVE" != "$LOCAL" ] && [ "$HIGHEST" = "$LOCAL" ]; then
            echo "::notice::registry is BEHIND ($LIVE < $LOCAL) — publishing"
            echo "behind=yes" >> "$GITHUB_OUTPUT"
          else
            echo "behind=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto patch-bump + publish to official registry (cascades to GitHub mirror)
        # Runs when EITHER our server.json drifted (tool set changed) OR the LIVE
        # registry is behind it. The second condition is the 2026-07-27 fix: this
        # step used to fire only on LOCAL drift, so once server.json was correct
        # the publisher went quiet — and the registry sat 2 MONTHS stale
        # (v2.1.10, "21,000+ facilities") while our file said 2.9.3/80 tools.
        # Verifying our own artifact instead of what the registry serves is the
        # same blind spot that cost us the front door and the listing board.
        if: steps.commit.outputs.server_json == 'yes' || steps.regdrift.outputs.behind == 'yes'
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          set -e
          if [ -z "$MCP_REGISTRY_DNS_KEY" ]; then
            echo "::warning::MCP_REGISTRY_DNS_KEY not set — repo healed but auto-publish skipped. Add the hex key to enable same-day refresh."
            exit 0
          fi
          # Compute + write a patch version strictly above the registry's latest (publish-only;
          # reverted after, so the repo's canonical version stays operator-owned).
          NEXT=$(node scripts/registry-autopublish.mjs)
          echo "auto patch-bump publish version: $NEXT"
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher || { echo "::warning::mcp-publisher download failed — skipping"; git checkout -- server.json; exit 0; }
          ./mcp-publisher login dns --domain dchub.cloud --private-key "$MCP_REGISTRY_DNS_KEY" \
            || { echo "::error::DNS login failed — MCP_REGISTRY_DNS_KEY must match the dchub.cloud apex TXT record"; git checkout -- server.json; exit 1; }
          OUT=$(./mcp-publisher publish 2>&1) || true
          echo "$OUT"
          git checkout -- server.json   # publish-only bump — never commit it
          if echo "$OUT" | grep -qi "Successfully published"; then
            echo "::notice::✅ auto-published $NEXT — official registry + GitHub mirror + aggregators refresh on their own cadence."
          else
            echo "::warning::publish did not confirm success — review the log above."
          fi
      - name: Sync GitHub About tool count (Glama & other About-mirroring aggregators)
        # The GitHub repo 'About' field is scraped by Glama (and other listings) but no
        # manifest file owns it — so it silently drifted to a stale "58 tools" while
        # README/server.json stayed correct, and Glama mirrored an even-older 33. This keeps
        # just the "<N> tools" phrase honest from server.mjs (the single source of truth).
        # Needs a PAT: the workflow GITHUB_TOKEN cannot edit repo metadata (no 'administration'
        # permission is grantable to it), so this is best-effort — warns, never fails, if unset.
        # Reuses REGISTRY_PR_PAT (already present for registry PR work); prefers a dedicated
        # REPO_METADATA_TOKEN if one is added later. The edit is non-fatal — a token lacking
        # 'Administration: write'/'repo' scope warns instead of failing the whole sync job.
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_TOKEN || secrets.REGISTRY_PR_PAT }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No PAT available (REPO_METADATA_TOKEN / REGISTRY_PR_PAT) — GitHub About sync skipped. Add a PAT with 'Administration: write' (fine-grained) or 'repo' scope (classic) so Glama re-crawls the correct tool count."
            exit 0
          fi
          N=$(node scripts/sync-tools-manifest.mjs --print-count)
          D=$(node scripts/sync-tools-manifest.mjs --print-deals)
          F=$(node scripts/sync-tools-manifest.mjs --print-facilities)
          CUR=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .description)
          # Heal the tool count, the deal count AND the facility count. The deal
          # count drifted 2,000+ -> 4,000+ unwatched (a ~2.9x over-claim from
          # AUTO-<date> re-ingest dupes) while only the tool count was auto-healed
          # — that blind spot was closed here.
          #
          # ★2026-08-31: and the SAME note then described a blind spot it was
          # itself leaving open. Two rules were added, facilities was not, so the
          # About field sat at "19,700+ facilities" against a canon of 19,900+ —
          # on the one surface no manifest file owns and Glama mirrors verbatim.
          # Two of three claims healed, the third unwatched, reported green.
          # Replace only the NUMBER before each noun; preserve the phrasing.
          #
          # Each rule is anchored on its OWN noun, so it cannot reach a
          # neighbouring population: the facilities rule must never touch
          # "300+ markets". Verified against the live About string before
          # shipping — facilities healed, markets and deals byte-identical,
          # and a second pass is a no-op.
          NEW=$(printf '%s' "$CUR" \
            | N="$N" perl -pe 's/\b\d+(?: MCP)? tools\b/$ENV{N}." tools"/e' \
            | D="$D" perl -pe 's/\b[\d,]+\+(\s+(?:tracked\s+)?(?:M&A\s+)?deals)\b/$ENV{D}.$1/e' \
            | F="$F" perl -pe 's/\b[\d,]+\+(\s+facilities)\b/$ENV{F}.$1/e')
          if [ "$CUR" = "$NEW" ]; then
            echo "✓ GitHub About already states ${N} tools / ${D} deals / ${F} facilities — no drift"
            exit 0
          fi
          echo "About drifted — healing:"; echo "  was: $CUR"; echo "  now: $NEW"
          if gh repo edit "${GITHUB_REPOSITORY}" --description "$NEW"; then
            echo "::notice::✅ GitHub About synced to ${N} tools / ${D} deals / ${F} facilities — Glama & other About-mirroring listings will re-scan on their own cadence."
          else
            echo "::warning::About edit failed — the PAT likely lacks repo 'Administration: write' / classic 'repo' scope. Grant it or add REPO_METADATA_TOKEN."
          fi
