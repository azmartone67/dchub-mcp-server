name: registry PR auto-submit

# 2026-07-09 — the one automatable "onboard a NEW MCP partner" path.
# Most registries require an owner login / have no API, but the GitHub
# awesome-mcp-servers curated lists accept PRs. This opens a well-formatted,
# idempotent PR to each configured list DC Hub is MISSING from.
#
# SAFE BY DEFAULT: dry-run unless BOTH secrets.REGISTRY_PR_PAT is set AND
# repo variable REGISTRY_PR_LIVE=1. Manual dispatch defaults to dry-run.
#   - REGISTRY_PR_PAT: a fine-grained PAT with `public_repo` (fork + PR) scope,
#     owned by the account that should author the PRs (azmartone67).
#   - vars.REGISTRY_PR_LIVE=1: flips scheduled runs from dry-run to live.
# Idempotent (skips if already listed or an open PR exists) + rate-limited
# (REGISTRY_PR_MAX, 2 PR/run) so it never spams maintainers. The cap is
# per RUN across ALL targets, and each target is a DIFFERENT upstream repo —
# so 2/run is at most one PR per maintainer, which is not the spamming this
# exists to prevent (that would be repeated PRs into the SAME repo, and the
# idempotence + declined-bound guards handle that separately).

# ── r-stop-the-rank-chase (2026-09-07) ────────────────────────────────────────
# SCHEDULE REMOVED. Kept as `workflow_dispatch` so this stays runnable on
# demand; the cron is preserved verbatim below so restoring it is one edit.
#
# WHY. Measured on production 2026-09-07, the registry/install channel over
# 30 days:
#     install_artifact_30d: 1 key minted, 0 called, 0 returned
#     ...and that one key's client_name is `verify-durability` — our OWN
#     durability probe, not a user. Zero real keys traced to the install pages.
#     signals_by_platform_30d: smithery 421 signals / 16 IPs / conv_rate 0.0%
#     calls_by_platform_30d:   `smithery connect` 2,238 calls from ONE IP
#                              (kind: tooling — the gateway itself, not users)
#     paid_signal_attribution_30d: 2 honest paid, 0 bridged to any MCP signal
# Against that, the merged-PR log for 2026-09-03..09-07 in this repo is almost
# entirely registry/listing work.
#
# ★ This does NOT claim the channel is worthless — install_artifact_30d is a
# declared FLOOR (an existing key-holder re-claiming gets their old key back
# and never appears), so 0 means "no NEW keys traced", not "nobody visited".
# It claims the AUTOMATED CADENCE is not earning its runs, and that a decision
# to spend here should be a human one, taken deliberately, not a cron.
#
# NOT disabled (deliberately): registry-refresh.yml — its first job is the
# stale-number GUARD that keeps $324B / wrong facility counts off
# journalist-facing registry pages. That is correctness, not rank.
on:
  #   schedule:
  #     # ★2026-08-30: moved 07:30 -> 07:40 so registry-discover (now 07:30)
  #     # runs FIRST. Ordering is asserted by test/registry-cron-order.test.mjs;
  #     # if you move either time, move it there too rather than deleting it.
  #     - cron: '40 7 * * 1'    # weekly, Monday 07:40 UTC — AFTER registry-discover
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Force dry-run (detect gaps, open nothing)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: registry-pr-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Detect gaps / open PRs
        env:
          REGISTRY_PR_PAT: ${{ secrets.REGISTRY_PR_PAT }}
          # ★2026-09-06 1 -> 2. #362 enabled two vetted targets at once
          # (AlexMili, AIAnytime). At 1/run a weekly lane takes two Mondays to
          # reach both, and registry-verify-listed correctly reports the
          # unreached one as MISSING — so the lane sits RED for a fortnight
          # over a backlog that is draining normally. Training people to
          # ignore a red registry lane is a worse outcome than one extra PR
          # to a different repo.
          REGISTRY_PR_MAX: '2'
        run: |
          # A manual dispatch with dry_run=true (the default) forces dry-run
          # regardless of the REGISTRY_PR_LIVE variable, so you can preview
          # exactly what it would submit before ever going live.
          LIVE_FLAG="${{ vars.REGISTRY_PR_LIVE }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then LIVE_FLAG=""; fi
          env REGISTRY_PR_LIVE="$LIVE_FLAG" node scripts/registry-pr-submit.mjs

      # ★ Runs AFTER the submit, ALWAYS (if: always()), because the outcome is the
      #   point and a submit failure must not hide it. For four consecutive weeks
      #   this workflow reported `success` while two of its three targets were not
      #   listed at all — "success" meant a branch was prepared, never that a
      #   maintainer accepted it. This step reports what is true on the wire.
      #
      #   It exits non-zero ONLY when a list has no entry AND no PR of ours (the
      #   lane genuinely did not submit). A PR pending a maintainer is reported,
      #   not failed — failing on it would train everyone to ignore this step,
      #   and the genuinely-broken case would go with it.
      #
      # ★2026-09-07 — THESE TWO STEPS ARE NOW COUPLED BY A FILE, ON PURPOSE.
      #   The submit step writes each PR number GitHub handed it to
      #   state/registry-pr-receipts.json (gitignored; scoped to GITHUB_RUN_ID
      #   so a receipt cannot outlive its run), and this step reads it. SAME
      #   JOB, same runner — so a PR opened four seconds ago is just on disk,
      #   with nothing to lag and no request to fail. That is the case run
      #   34097298531 got wrong, and the one the two GitHub-side lookups can
      #   still only answer "I could not look" for when both are blind.
      #   Splitting these into separate jobs loses the receipt handoff; the
      #   verifier degrades to the head-filtered /pulls read (#379) rather than
      #   breaking, but it stops being correct-by-construction.
      - name: Verify the listings actually landed
        if: always()
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/registry-verify-listed.mjs
