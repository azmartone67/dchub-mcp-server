name: plugin-scanner

# HOL plugin-scanner quality gate.
# Docs: https://hol.org/docs/libraries/ai-plugin-scanner/plugin-scanner/github-action/
# Third-party actions are pinned to commit SHAs, matching this repo's workflow convention.
# report_to_hol lets the public HOL Plugins listing show this repository as checked in CI
# and requires id-token: write. submission_enabled stays off; DC Hub is already listed.
#
# trust_repository_policy: true makes the action read .plugin-scanner.toml, which holds
# ONLY narrow path exclusions for inspected false positives (test fixtures, a frozen
# ChatGPT schema). No rule is disabled and the thresholds below are unchanged. This adds
# no new bypass: on pull_request the workflow file itself already comes from the PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: AI plugin quality gate
        uses: hashgraph-online/ai-plugin-scanner-action@013b123a036a252a6d74ddb52836ee923498150c # v1.2.817
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          trust_repository_policy: true
          report_to_hol: true
          submission_enabled: false
