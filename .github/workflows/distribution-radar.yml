name: distribution radar

# Weekly distribution worklist (the adoption + discoverability lever). Audits the
# curated MCP directory + 'best MCP' roundup targets — is dchub.cloud listed? —
# and opens/refreshes ONE GitHub issue with the worklist + the matching draft for
# each gap. READ-ONLY audit; it does NOT send any outreach (cold publisher pitches
# stay human — drafts in ~/Downloads/dchub-mcp-tier3/). A target flips ✅ once a
# pitch lands, so the issue self-prunes as you work it.

# ── r-stop-the-rank-chase (2026-09-07) ────────────────────────────────────────
# SCHEDULE REMOVED. Kept as `workflow_dispatch` so this stays runnable on
# demand; the cron is preserved verbatim below so restoring it is one edit.
#
# WHY. Measured on production 2026-09-07, the registry/install channel over
# 30 days:
#     install_artifact_30d: 1 key minted, 0 called, 0 returned
#     ...and that one key's client_name is `verify-durability` — our OWN
#     durability probe, not a user. Zero real keys traced to the install pages.
#     signals_by_platform_30d: smithery 421 signals / 16 IPs / conv_rate 0.0%
#     calls_by_platform_30d:   `smithery connect` 2,238 calls from ONE IP
#                              (kind: tooling — the gateway itself, not users)
#     paid_signal_attribution_30d: 2 honest paid, 0 bridged to any MCP signal
# Against that, the merged-PR log for 2026-09-03..09-07 in this repo is almost
# entirely registry/listing work.
#
# ★ This does NOT claim the channel is worthless — install_artifact_30d is a
# declared FLOOR (an existing key-holder re-claiming gets their old key back
# and never appears), so 0 means "no NEW keys traced", not "nobody visited".
# It claims the AUTOMATED CADENCE is not earning its runs, and that a decision
# to spend here should be a human one, taken deliberately, not a cron.
#
# NOT disabled (deliberately): registry-refresh.yml — its first job is the
# stale-number GUARD that keeps $324B / wrong facility counts off
# journalist-facing registry pages. That is correctness, not rank.
on:
  #   schedule:
  #     - cron: '23 15 * * 1'        # Mondays 15:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: distribution-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run distribution radar
        id: radar
        run: python3 scripts/distribution_radar.py

      - name: Open / refresh the distribution worklist issue
        if: steps.radar.outputs.gaps != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📡 Distribution worklist (directories + roundups)"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file distribution_report.md
          else
            gh issue create --title "$TITLE" --body-file distribution_report.md \
              --label "distribution,automated" 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file distribution_report.md
          fi

      - name: Close the worklist when everything is listed
        if: steps.radar.outputs.gaps == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📡 Distribution worklist (directories + roundups)"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "✅ All tracked directories + roundups now list DC Hub. Auto-closing — radar keeps watching weekly."
            gh issue close "$NUM"
          fi
