name: actions-openapi-check
# Enforces the ChatGPT Actions OpenAPI contract (ChatGPT integrator review, 2026-07-16):
# valid schema, unique operationIds, concrete response schemas, shared PaidPreview on
# every gated op, well-formed x-agent. Prevents interface drift as the tool surface grows.
on:
  push:
    branches: [main]
    paths: ['integrations/chatgpt/openapi.json', 'integrations/chatgpt/validate_actions_openapi.py']
  pull_request:
    paths: ['integrations/chatgpt/openapi.json', 'integrations/chatgpt/validate_actions_openapi.py']
  workflow_dispatch: {}
jobs:
  # ★2026-09-07 renamed from `check`. A job with no `name:` posts its JOB ID as the
  # status context, and `check` is one of the three REQUIRED contexts on main —
  # owned by manifest-consistency.yml, which runs on every pull_request. This
  # workflow is path-filtered, so on a PR touching integrations/chatgpt/openapi.json
  # AND server.json there were TWO check runs called `check`, and which one branch
  # protection reads is not something to leave to chance — manifest-consistency now
  # carries the server.json version fence that has to be un-maskable.
  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate ChatGPT Actions OpenAPI contract
        run: python3 integrations/chatgpt/validate_actions_openapi.py integrations/chatgpt/openapi.json
