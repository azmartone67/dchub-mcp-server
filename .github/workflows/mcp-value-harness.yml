name: mcp-value-harness
# Calls each flagship MCP tool through the live gateway and asserts the payload
# is non-empty. Catches a tool returning a success envelope with NO data — the
# one failure mode test_honest_numbers.py (string constants) cannot see.
on:
  schedule:
    # r-harness-fix (2026-06-22): was '*/15 * * * *' (96 runs/day, each burning
    # paid-key quota AND hard-failing red when the secret was unset). Reduced to
    # hourly — still catches an empty-payload regression within ~1h of a deploy,
    # at 1/4 the quota burn.
    - cron: '17 * * * *'
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run value harness
        env:
          DCHUB_MCP_KEY: ${{ secrets.DCHUB_MCP_PAID_KEY }}
        run: |
          # r-harness-fix: SOFT-SKIP (exit 0) instead of hard-fail when the paid
          # key isn't configured — a config gap should not paint the scheduled
          # job red every run. Add DCHUB_MCP_PAID_KEY to repo secrets to actually
          # run the payload assertions.
          if [ -z "$DCHUB_MCP_KEY" ]; then
            echo "::notice::DCHUB_MCP_PAID_KEY secret not set — skipping the value harness (add a paid/enterprise key to repo secrets to enable it)."
            exit 0
          fi
          bash tools/mcp_value_harness.sh
