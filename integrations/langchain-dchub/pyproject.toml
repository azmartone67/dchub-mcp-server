[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-dchub"
dynamic = ["version"]
description = "An integration package connecting DC Hub (data-center, power-grid and energy data) and LangChain"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DC Hub (dchub.cloud)" }]
keywords = ["langchain", "data-center", "datacenter", "power-grid", "energy", "electricity", "mcp", "dchub", "site-selection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "dchub>=0.3.0,<0.4.0",
]

[project.urls]
Homepage = "https://dchub.cloud"
Documentation = "https://github.com/azmartone67/dchub-mcp-server/tree/main/integrations/langchain-dchub#readme"
Repository = "https://github.com/azmartone67/dchub-mcp-server/tree/main/integrations/langchain-dchub"
Issues = "https://github.com/azmartone67/dchub-mcp-server/issues"
MCP = "https://dchub.cloud/mcp"

[dependency-groups]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain-tests==1.1.9",
]
lint = ["ruff>=0.13.1,<0.14.0"]

[tool.hatch.version]
path = "langchain_dchub/_version.py"

[tool.hatch.build.targets.sdist]
include = ["langchain_dchub", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_dchub"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "integration: calls the live DC Hub API (anonymous, QA User-Agent)",
    "compile: placeholder used to compile integration tests without running them",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S", "T20", "RUF"]
ignore = ["D203", "D213", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101", "D"]
