# DC Hub is a remote/hosted Streamable HTTP server, not an npm package.
runtime: remote
remote:
  type: streamable-http
  url: "https://dchub.cloud/mcp"

# Optional API key. DC Hub is keyless-first — with NO key you still get the
# free tier (previews, no key needed, live grid scoreboard). Paste a
# key here to raise limits + unlock full results, and Smithery reuses it across sessions so
# you never re-mint. Get a free key by calling the `claim_free_key` tool once
# (no email), or use a paid key. Left blank → the header renders empty and the
# server treats it exactly like no key (anonymous tier), so this never breaks
# keyless use.
configSchema:
  type: object
  required: []
  properties:
    apiKey:
      type: string
      title: "DC Hub API key — paste one to raise your limits"
      description: >-
        Recommended. Blank = anonymous tier: previews, no key
        needed. A FREE key gives previews plus 2 full answers per tool per day, no email, no card:
        connect once and call `claim_free_key`, then paste the key here so
        every future session starts identified. Add an email with
        `bind_email` for 50 calls/day (up to 10 full answers per tool per day).
        Saved sites and alerts need a key at all (they are per-account).
        A paid key raises limits further.
      format: password

# Smithery injects the configured apiKey as the X-API-Key header the server
# already reads for auth/tier. Blank apiKey → empty header → anonymous tier.
headers:
  X-API-Key: "{{apiKey}}"

