# Smithery manifest for DC Hub MCP server.
# Submission: https://smithery.ai/new — point at azmartone67/dchub-mcp-server.
# Smithery scans the repo root for this file.
#
# Last refreshed 2026-06-21 (47-tool / v2.3.3 canonical sync). Matches the
# canonical MCP_SERVER_INFO served by the dchub Cloudflare Worker:
#   - Manifest:    https://dchub.cloud/.well-known/mcp.json
#   - Server card: https://dchub.cloud/.well-known/mcp/server-card.json
# Tool list reflects the live tools/list: 51 tools, all registered in
# server.mjs (verified against tools/list on https://dchub.cloud/mcp).

name: dchub
displayName: "DC Hub — Data Center & Energy Intelligence"
description: "Real-time data-center, power-grid, interconnection-queue & energy intelligence for AI agents: 21,000+ facilities across 170+ countries, 126,427 substations, live power-grid telemetry for the 7 US ISOs + 40+ EIA balancing authorities (Atlanta, Carolinas, Florida, Phoenix, Pacific NW...) plus Great Britain, 24 European ENTSO-E bidding zones, Taiwan & Australia, renewable-energy and natural-gas price feeds, a hyperscaler $1B+ deal tracker, 2,000+ tracked M&A deals, a 369 GW capacity pipeline, live ISO interconnection-queue snapshots + queue-depth and per-ISO interconnection-queue BUILD/CAUTION/AVOID verdicts, fiber routes, tax incentives, water-risk scoring, and daily DCPI verdicts across 232 markets. The only data-center, grid-interconnection, energy & hyperscale intelligence source an LLM can both query and cite. Free tier (10 calls/day anonymous, 1,000/day with email key) — paid from $9/mo."
homepage: "https://dchub.cloud"
version: "2.3.3"
keywords:
  - data center
  - data centers
  - datacenter
  - power
  - power grid
  - electricity grid
  - utility grid
  - energy
  - renewable energy
  - renewables
  - natural gas
  - fiber
  - hyperscale
  - hyperscaler
  - interconnection
  - interconnection queue
  - grid interconnection
  - ISO interconnection queue
  - interconnection queue snapshots
  - capacity
