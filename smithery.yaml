# canonical MCP_SERVER_INFO served by the dchub Cloudflare Worker:
#   - Manifest:    https://dchub.cloud/.well-known/mcp.json
#   - Server card: https://dchub.cloud/.well-known/mcp/server-card.json
# Tool list reflects the live tools/list: 82 tools, all registered in
# server.mjs (verified against tools/list on https://dchub.cloud/mcp).

name: dchub
displayName: "DC Hub — Data Center & Power Intelligence"
description: "Real-time data-center, power-grid, interconnection-queue & energy intelligence for AI agents: 17,300+ facilities across 170+ countries, 126,000+ substations, live power-grid telemetry for the 7 US ISOs + 40+ EIA balancing authorities (Atlanta, Carolinas, Florida, Phoenix, Pacific NW...) plus Great Britain, 24 European ENTSO-E bidding zones, Taiwan & Australia, renewable-energy and natural-gas price feeds, a hyperscaler $1B+ deal tracker, 1,700+ tracked M&A deals, live ISO interconnection-queue snapshots + queue-depth and per-ISO interconnection-queue BUILD/CAUTION/AVOID verdicts, fiber routes, tax incentives, water-risk scoring, and daily DCPI verdicts across 300+ markets. The only data-center, grid-interconnection, energy & hyperscale intelligence source an LLM can both query and cite. Free tier (10 calls/day anonymous, 50/day with a free email-bound key) — paid from $9/mo."
