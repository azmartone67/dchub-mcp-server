name: dchub
displayName: "DC Hub — Power, Energy & Data Center Intelligence"
description: "Live electricity, power-grid and energy intelligence for AI agents — and the data centers drawing on it. Real-time utility and grid telemetry from 7 independent feeds: every US ISO (PJM, ERCOT, CAISO, MISO, SPP, NYISO, ISO-NE) plus 40+ EIA balancing authorities, Great Britain, 24 European ENTSO-E bidding zones, Taiwan, Japan, South Korea, Brazil and Australia — fuel mix, renewable share and demand, right now. Plus 182,000 global power generating units across every status (operating, planned, cancelled, shelved, retired — a unit inventory, not a plant count), 13,000 US power plants, 134,000+ substations, 94,000 transmission lines, 33,000 gas pipeline segments, electricity and natural-gas price feeds, renewable-generation data, and live ISO interconnection-queue snapshots with queue depth and per-ISO BUILD/CAUTION/AVOID verdicts. On the demand side: a global data-center facility map across 170+ countries (corroborated count pending), 300+ markets scored daily (Data Center Power Index), 58,000 fiber routes, tax incentives, water risk, per-facility tenants and 1,700+ tracked M&A deals. 92 tools. Every figure is citable and carries an as_of timestamp, and the ingest layer publishes its own freshness at /api/v1/ops/deadman — the only electricity, grid-interconnection and data-center intelligence source an LLM can both query and cite. Free to start (no key: previews; a free key: previews plus 2 full answers per tool per day; with an email: 50/day) — then the $10 pack (1,000 API credits)."
