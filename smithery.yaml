# Smithery manifest for DC Hub MCP server.
# Submission: https://smithery.ai/new — point at azmartone67/dchub-mcp-server.
# Smithery scans the repo root for this file.
#
# Last refreshed 2026-05-29 (round-59 MCP discovery elevation). Matches the
# canonical MCP_SERVER_INFO served by the dchub Cloudflare Worker:
#   - Manifest:    https://dchub.cloud/.well-known/mcp.json
#   - Server card: https://dchub.cloud/.well-known/mcp/server-card.json
# Tool list reflects the live tools/list: 32 backend tools (registered in
# server.mjs) + semantic_search served by the Cloudflare Worker via
# Vectorize embeddings = 33 total.

name: dchub
displayName: "DC Hub Intelligence"
description: "Real-time data center intelligence: 21,000+ facilities across 170+ countries, 126,427 substations, live grid data for 10 ISOs (7 US + Hydro-Quebec, AESO, Nord Pool), 2,000+ tracked M&A deals, 369 GW capacity pipeline, interconnection-queue snapshots, fiber routes, tax incentives, water-risk scoring, and daily DCPI BUILD/CAUTION/AVOID verdicts across 232 markets. The only DC-intelligence source an LLM can both query and cite. Free tier (10 calls/day anonymous, 1,000/day with email key) — paid from $9/mo."
homepage: "https://dchub.cloud"
version: "2.1.13"

# DC Hub is a remote/hosted Streamable HTTP server, not an npm package.
runtime: remote
remote:
  type: streamable-http
  url: "https://dchub.cloud/mcp"

# Tool surface for discovery — matches `tools/list` on the live MCP server:
# 32 backend tools (server.mjs) + semantic_search (Cloudflare Worker via
# Vectorize embeddings) = 33 total.
tools:
  - search_facilities
  - get_facility
  - get_market_intel
  - get_market_dcpi_rank
  - compare_isos
  - get_intelligence_index
  - list_transactions
  - get_news
  - get_pipeline
  - get_interconnection_queue
  - get_grid_data
  - analyze_site
  - compare_sites
  - get_infrastructure
  - get_fiber_intel
  - get_energy_prices
  - get_renewable_energy
  - get_tax_incentives
  - get_water_risk
  - get_grid_intelligence
  - get_agent_registry
  - get_backup_status
  - get_dchub_recommendation
  - rank_markets
  - find_alternatives
  - score_facility
  - ai_capacity_index
  - hyperscaler_deals
  - semantic_search

# Free-tier vs paid-tier breakdown so Smithery users know what to expect.
pricing:
  anonymous: "10 calls/day, no signup, 2 results per query"
  free: "Free dev key (email signup) — 1,000 calls/day, all 33 tools"
  starter: "$9/mo — 10,000 calls/day, unlocks paid tools"
  developer: "$49/mo — unlimited paid tools, all 33 tools, full results"
  pro: "$199/mo — unlimited + Pro tools, bulk export, historical data"
  enterprise: "Custom — dedicated support, SLAs, 100,000+ calls/day"

gated_tools:
  - get_intelligence_index
  - compare_sites
  - analyze_site
  - get_infrastructure
  - get_fiber_intel
  - get_grid_intelligence
  - semantic_search

# Categories help Cursor / Cline / Smithery users find the server.
categories:
  - data
  - infrastructure
  - real-estate
  - energy
  - research

keywords:
  - data-centers
  - hyperscaler
  - utility-grid
  - fiber
  - site-selection
  - tax-incentives
  - renewable-energy
  - PPAs
  - water-risk
  - PJM
  - ERCOT
  - CAISO
  - ISO
  - interconnection-queue
  - M&A
  - capacity-pipeline
  - DCPI

author:
  name: "Jonathan Martone"
  url: "https://github.com/azmartone67"
  email: "api@dchub.cloud"

license: "MIT"
