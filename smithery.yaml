  free: "Free key (call claim_free_key — no email) — previews plus 2 full answers per tool per day; every tool callable, most as previews"
  identified: "Add an email (bind_email) — 50 calls/day, up to 10 full answers per tool per day"
  developer: "500 calls/day; full results on all tools except 7 Pro tools (10 full grid/fiber answers/day, previews of site analysis) — see https://dchub.cloud/pricing"
  pro: "2,000 calls/day + Pro tools, bulk export, historical data — see https://dchub.cloud/pricing"
  enterprise: "Dedicated support, SLAs, 100,000+ calls/day — see https://dchub.cloud/pricing"

