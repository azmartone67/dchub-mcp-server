# DC Hub is a remote/hosted Streamable HTTP server, not an npm package.
runtime: remote
remote:
  type: streamable-http
  url: "https://dchub.cloud/mcp"

# Optional API key. DC Hub is keyless-first — with NO key you still get the
# free tier (10 calls/day, live grid scoreboard, previews). Paste a key here to
# raise limits + unlock full results, and Smithery reuses it across sessions so
# you never re-mint. Get a free key by calling the `claim_free_key` tool once
# (no email), or use a paid key. Left blank → the header renders empty and the
# server treats it exactly like no key (anonymous tier), so this never breaks
# keyless use.
configSchema:
  type: object
  required: []
  properties:
    apiKey:
      type: string
      title: "DC Hub API key — paste one to double your daily calls"
      description: >-
        Recommended. Blank = anonymous tier, 5 calls/day, results trimmed to a
        preview. A FREE key doubles that to 10 calls/day and returns full
        results — no email, no card: connect once and call `claim_free_key`,
        then paste the key here so every future session starts identified.
        Saved sites and alerts need a key at all (they are per-account).
        A paid key raises limits further.
      format: password

# Smithery injects the configured apiKey as the X-API-Key header the server
# already reads for auth/tier. Blank apiKey → empty header → anonymous tier.
headers:
  X-API-Key: "{{apiKey}}"

