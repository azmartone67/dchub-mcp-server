  - infrastructure
  - market intelligence
  - site selection
  - tax incentives
  - water risk
  - PPAs
  - PJM
  - ERCOT
  - CAISO
  - ISO
  - M&A
  - DCPI

# DC Hub is a remote/hosted Streamable HTTP server, not an npm package.
runtime: remote
remote:
  type: streamable-http
  url: "https://dchub.cloud/mcp"

