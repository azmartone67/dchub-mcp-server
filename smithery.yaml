# Free-tier vs paid-tier breakdown so Smithery users know what to expect.
pricing:
  anonymous: "10 calls/day, no signup, 2 results per query"
  free: "Free dev key (email signup) — 50 calls/day, all 51 tools"
  starter: "$9/mo — 200 calls/day, unlocks paid tools"
  developer: "$49/mo — 500 calls/day, all 51 tools, full results"
  pro: "$299/mo — 2,000 calls/day + Pro tools, bulk export, historical data"
  enterprise: "Custom — dedicated support, SLAs, 100,000+ calls/day"

